<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>クイックメモ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="クイックメモ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-quick-180.png">
<link rel="preconnect" href="https://itvumfppblhirvbuynwt.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<!-- Web font is loaded without blocking first paint (media="print" swap) so the
     input screen can appear before the font request finishes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #faf9f7; --border: #e2e0d8;
  --text: #1a1916; --text2: #6b6860; --text3: #a9a79f; --soft: #e8e6df;
  --green: #2d6a4f; --greenbg: #eaf4ee; --red: #9b2c2c; --redbg: #fdf0f0;
  --mono: 'BIZ UDGothic', monospace; --sans: 'BIZ UDPGothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1c1b18; --border: #2e2c28;
    --text: #f0ede6; --text2: #8a877e; --text3: #4a4844; --soft: #252320;
    --green: #4ade80; --greenbg: #0d2e1a; --red: #f87171; --redbg: #2a0f0f;
  }
}
html, body { height: 100%; font-family: var(--sans), 'Hiragino Sans', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none; }

#login-screen {
  height: 100vh; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
#login-screen.hide { display: none; }
#login-box { width: 100%; max-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
#login-box h1 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
#login-box p { font-size: 12px; color: var(--text3); margin-bottom: 20px; font-family: var(--mono); }
#login-box input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; outline: none; margin-bottom: 10px; }
#login-box input:focus { border-color: var(--text2); }
#login-box button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--text); color: var(--bg); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
#login-box button:hover { opacity: .9; }
#login-err { font-size: 12px; color: var(--red); margin-top: 10px; font-family: var(--mono); min-height: 16px; }

#app {
  display: none; flex-direction: column;
  height: 100vh; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app.show { display: flex; }
#q-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
}
#q-head h1 { font-size: 14px; font-weight: 500; }
#q-save { padding: 7px 16px; border: none; border-radius: 8px; background: var(--text); color: var(--bg); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; flex-shrink: 0; }
#q-save:hover { opacity: .9; }
#q-save:disabled { opacity: .4; cursor: default; }
#q-meta { display: flex; gap: 8px; padding: 12px 18px 0; flex-shrink: 0; }
#q-title, #q-folder {
  padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text); font-family: var(--sans); font-size: 16px; outline: none;
}
#q-title { flex: 1; min-width: 0; }
#q-folder { width: 38%; max-width: 180px; color: var(--text2); }
#q-title:focus, #q-folder:focus { border-color: var(--text2); }
#q-title::placeholder { color: var(--text3); }
#q-body { flex: 1; display: flex; flex-direction: column; padding: 12px 18px 18px; min-height: 0; }
#q-input {
  flex: 1; width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-family: var(--sans); font-size: 16px;
  line-height: 1.7; resize: none; outline: none;
}
#q-input:focus { border-color: var(--text2); }
#q-foot { padding: 0 18px calc(14px + env(safe-area-inset-bottom)); flex-shrink: 0; }
#q-status { font-size: 12px; font-family: var(--mono); color: var(--text3); min-height: 16px; }
#q-status.ok { color: var(--green); }
#q-status.err { color: var(--red); }
</style>
</head>
<body>

<div id="login-screen" class="hide">
  <div id="login-box">
    <h1>クイックメモ</h1>
    <p>ログインしてください</p>
    <input id="login-email" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="login-pass" type="password" placeholder="パスワード" autocomplete="current-password">
    <button onclick="doLogin()">ログイン</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="app">
  <div id="q-head">
    <h1>✏️ クイックメモ</h1>
    <button id="q-save" onclick="saveQuickNote()">保存</button>
  </div>
  <div id="q-meta">
    <input id="q-title" placeholder="タイトル(省略可)" autocomplete="off" enterkeyhint="next">
    <select id="q-folder" aria-label="フォルダ"><option value="">📁 未分類</option></select>
  </div>
  <div id="q-body">
    <textarea id="q-input" placeholder="ここに入力…"></textarea>
  </div>
  <div id="q-foot">
    <span id="q-status"></span>
  </div>
</div>

<script>
/* Launch speed: a Supabase session from a previous visit lives in localStorage
   and is readable synchronously, so if one is there we show the input screen
   RIGHT NOW — before the Supabase script has even downloaded — instead of
   waiting for getSession() (which can itself need a network round-trip to
   refresh an expired token). The real session check still runs afterwards;
   in the rare case it fails, the login screen takes over (typed text stays). */
(function showAppEarly() {
  try {
    if (localStorage.getItem('sb-itvumfppblhirvbuynwt-auth-token')) {
      document.getElementById('app').classList.add('show');
      document.getElementById('q-input').focus();
      return;
    }
  } catch (e) {}
  document.getElementById('login-screen').classList.remove('hide');
})();
</script>

<script>
/* Minimal sibling to index.html: same Supabase project. Its only job is
   "type something (optional title / folder), tap 保存, it becomes a new note". */
const SUPABASE_URL = 'https://itvumfppblhirvbuynwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iOkh_MHaXukHHDHV8d8Shw__rwczL54';
const sessionId = crypto.randomUUID();
const FOLDER_CACHE_KEY = 'quickFoldersCache';
const FOLDER_PICK_KEY = 'quickLastFolder';
let sb = null, uid = null;
let resolveAuthKnown;
const authKnown = new Promise(r => { resolveAuthKnown = r; });

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function showApp() {
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app').classList.add('show');
  document.getElementById('q-input').focus();
}
function showLogin() {
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hide');
}

/* ── Folder picker ──
   Rendered first from a local cache (so it's populated instantly at launch),
   then refreshed from the server once the session is confirmed. */
function renderFolderOptions(list) {
  const sel = document.getElementById('q-folder');
  const want = sel.value || lsGet(FOLDER_PICK_KEY) || '';
  sel.innerHTML = '';
  const none = document.createElement('option');
  none.value = ''; none.textContent = '📁 未分類';
  sel.appendChild(none);
  list.forEach(f => {
    const o = document.createElement('option');
    o.value = f.id; o.textContent = '📁 ' + f.name;
    sel.appendChild(o);
  });
  sel.value = list.some(f => f.id === want) ? want : '';
}
async function refreshFolders() {
  try {
    const { data, error } = await sb.from('folders').select('id,name,sort_order').order('sort_order', { ascending: true });
    if (error) throw error;
    const list = (data || []).map(f => ({ id: f.id, name: f.name }));
    lsSet(FOLDER_CACHE_KEY, JSON.stringify(list));
    renderFolderOptions(list);
  } catch (e) { console.error('load folders failed', e); }
}
document.getElementById('q-folder').addEventListener('change', e => lsSet(FOLDER_PICK_KEY, e.target.value));
try { renderFolderOptions(JSON.parse(lsGet(FOLDER_CACHE_KEY) || '[]')); } catch (e) {}

/* ── Auth ── */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = 'ログインできませんでした: ' + error.message; return; }
  uid = data.user.id;
  showApp();
  refreshFolders();
}
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Deferred scripts (the Supabase library) have run by DOMContentLoaded.
window.addEventListener('DOMContentLoaded', async () => {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { uid = session.user.id; showApp(); refreshFolders(); }
    else showLogin();
  } catch (e) { showLogin(); }
  resolveAuthKnown();
});

function setStatus(msg, cls) {
  const el = document.getElementById('q-status');
  el.textContent = msg;
  el.className = cls || '';
}

async function saveQuickNote() {
  const input = document.getElementById('q-input');
  const titleEl = document.getElementById('q-title');
  const content = input.value.trim();
  const title = titleEl.value.trim();
  if (!content && !title) return;

  const btn = document.getElementById('q-save');
  btn.disabled = true;
  setStatus('保存中…');
  try {
    await authKnown; // the screen is usable before this settles; saving is what has to wait
    if (!uid) { showLogin(); setStatus(''); return; }
    const folderId = document.getElementById('q-folder').value || null;
    // A fresh note each time. sort_order puts it at the very front of the
    // manually-ordered list too (matters on desktop; mobile sorts by update time).
    const { data: minRow } = await sb.from('notes').select('sort_order').order('sort_order', { ascending: true }).limit(1).maybeSingle();
    const minOrder = minRow ? (minRow.sort_order ?? 0) : 0;
    const { error } = await sb.from('notes').insert({
      id: crypto.randomUUID(), user_id: uid, title, content, theme: [],
      pinned: false, folder_id: folderId, sort_order: minOrder - 1,
      updated_at: new Date().toISOString(), last_writer_session: sessionId
    });
    if (error) throw error;
    input.value = '';
    titleEl.value = '';
    setStatus('保存しました ✓', 'ok');
    setTimeout(() => setStatus(''), 2000);
  } catch (e) {
    setStatus('保存に失敗しました: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

// Enter in the title box jumps to the body; Ctrl/Cmd+Enter saves from anywhere.
document.getElementById('q-title').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); document.getElementById('q-input').focus(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); saveQuickNote(); }
});
</script>
</body>
</html>
