<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #faf9f7; --border: #e2e0d8;
  --text: #1a1916; --text2: #6b6860; --text3: #a9a79f; --soft: #e8e6df;
  --green: #2d6a4f; --greenbg: #eaf4ee; --red: #9b2c2c; --redbg: #fdf0f0;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1c1b18; --border: #2e2c28;
    --text: #f0ede6; --text2: #8a877e; --text3: #4a4844; --soft: #252320;
    --green: #4ade80; --greenbg: #0d2e1a; --red: #f87171; --redbg: #2a0f0f;
  }
}
html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); }
#app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
#sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#s-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#s-head span { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; }
#s-head-btns { display: flex; gap: 6px; }
.hbtn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: .15s; }
.hbtn:hover { background: var(--soft); color: var(--text); }
.hbtn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
#s-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
#s-search input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; }
#s-search input:focus { border-color: var(--text2); }
#s-search input::placeholder { color: var(--text3); }
#s-conn { margin: 8px 12px 2px; font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 100px; border: 1px solid var(--border); color: var(--text3); display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
#s-conn.ok { color: var(--green); background: var(--greenbg); border-color: var(--greenbg); }
#s-conn.err { color: var(--red); background: var(--redbg); border-color: var(--redbg); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
#s-list { flex: 1; overflow-y: auto; }
#s-list::-webkit-scrollbar { width: 3px; }
#s-list::-webkit-scrollbar-thumb { background: var(--border); }
.nitem { padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; position: relative; user-select: none; }
.nitem:hover { background: var(--soft); }
.nitem.sel { background: var(--bg); }
.nitem.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--text); }
.nitem.trashed { opacity: .65; }
.nt { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.np { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nd { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--mono); }
.empty-msg { padding: 20px; font-size: 13px; color: var(--text3); text-align: center; font-family: var(--mono); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#m-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 8px; font-size: 13px; font-family: var(--mono); }
#editor { flex: 1; display: none; flex-direction: column; overflow: hidden; }

/* Editor bar */
#e-bar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#e-title { flex: 1; background: none; border: none; font-size: 16px; font-weight: 500; font-family: var(--sans); color: var(--text); outline: none; min-width: 100px; }
#e-title::placeholder { color: var(--text3); font-weight: 300; }
#e-status { font-size: 11px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
#e-status.ok { color: var(--green); }
#e-status.err { color: var(--red); }
.ebtn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text2); font-size: 12px; font-family: var(--mono); cursor: pointer; transition: .15s; }
.ebtn:hover { background: var(--soft); color: var(--text); }
.ebtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.ebtn.del:hover { background: var(--redbg); color: var(--red); border-color: var(--redbg); }
.ebtn.res:hover { background: var(--greenbg); color: var(--green); border-color: var(--greenbg); }

/* Editor body: split pane */
#e-body { flex: 1; display: flex; overflow: hidden; }

#e-input {
  flex: 1;
  padding: 20px 24px;
  border: none;
  background: none;
  resize: none;
  font-size: 14px;
  line-height: 1.85;
  font-family: var(--mono);
  font-weight: 300;
  color: var(--text);
  outline: none;
  overflow-y: auto;
}
#e-input::-webkit-scrollbar { width: 3px; }
#e-input::-webkit-scrollbar-thumb { background: var(--border); }
#e-input::placeholder { color: var(--text3); }

#e-preview {
  flex: 1;
  padding: 20px 24px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.85;
  font-weight: 300;
  border-left: 1px solid var(--border);
  display: none;
}
#e-preview::-webkit-scrollbar { width: 3px; }
#e-preview::-webkit-scrollbar-thumb { background: var(--border); }

/* Preview markdown styles */
#e-preview h1 { font-size: 1.6em; font-weight: 500; margin: .4em 0 .3em; padding-bottom: .2em; border-bottom: 1px solid var(--border); line-height: 1.3; }
#e-preview h2 { font-size: 1.3em; font-weight: 500; margin: .6em 0 .2em; line-height: 1.3; }
#e-preview h3 { font-size: 1.1em; font-weight: 500; margin: .5em 0 .2em; }
#e-preview p { margin: .35em 0; }
#e-preview ul, #e-preview ol { padding-left: 1.4em; margin: .3em 0; }
#e-preview li { margin: .1em 0; }
#e-preview strong { font-weight: 500; }
#e-preview em { font-style: italic; }
#e-preview code { font-family: var(--mono); font-size: .87em; background: var(--soft); padding: .1em .35em; border-radius: 4px; }
#e-preview pre { background: var(--soft); padding: .8em 1em; border-radius: 6px; margin: .4em 0; overflow-x: auto; }
#e-preview pre code { background: none; padding: 0; }
#e-preview blockquote { border-left: 3px solid var(--border); padding-left: .8em; color: var(--text2); margin: .4em 0; }
#e-preview a { color: var(--green); }
#e-preview hr { border: none; border-top: 1px solid var(--border); margin: .6em 0; }
#e-preview table { border-collapse: collapse; width: 100%; font-size: 13px; margin: .4em 0; }
#e-preview th, #e-preview td { border: 1px solid var(--border); padding: 5px 9px; }
#e-preview th { background: var(--soft); font-weight: 500; }

/* Dialog */
#dialog-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; align-items: center; justify-content: center; }
#dialog-bg.show { display: flex; }
#dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 26px; width: 320px; }
#dialog h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
#dialog p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 18px; }
.d-btns { display: flex; gap: 8px; justify-content: flex-end; }
.d-btns button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: none; font-family: var(--sans); font-size: 13px; color: var(--text); cursor: pointer; }
.d-btns button.confirm { background: var(--red); color: #fff; border-color: var(--red); }

/* Mobile */
@media (max-width: 580px) {
  #sidebar { position: fixed; inset: 0; z-index: 10; width: 100% !important; transform: translateX(-100%); transition: transform .25s; }
  #sidebar.open { transform: translateX(0); }
  #mob-back { display: flex !important; }
  #e-preview { display: none !important; }
}
#mob-back { display: none; align-items: center; gap: 5px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 13px; font-family: var(--sans); padding: 4px 0; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">

  <div id="sidebar" class="open">
    <div id="s-head">
      <span id="s-label">Memo</span>
      <div id="s-head-btns">
        <button class="hbtn" id="trash-btn" title="ゴミ箱" onclick="toggleTrash()">🗑</button>
        <button class="hbtn" id="new-btn" title="新規" onclick="newNote()">＋</button>
      </div>
    </div>
    <div id="s-search"><input id="search-input" placeholder="検索…" oninput="onSearch(this.value)"></div>
    <div id="s-conn"><span class="dot"></span><span id="conn-label">接続確認中…</span></div>
    <div id="s-list"></div>
  </div>

  <div id="main">
    <div id="m-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span>メモを選択 または 新規作成</span>
    </div>

    <div id="editor">
      <div id="e-bar">
        <button id="mob-back" onclick="closeMobile()">← 一覧</button>
        <input id="e-title" placeholder="タイトル…" oninput="onEdit()">
        <span id="e-status"></span>
        <button class="ebtn" id="btn-preview" onclick="togglePreview()">プレビュー</button>
        <button class="ebtn del" id="btn-del" onclick="askDelete()">削除</button>
        <button class="ebtn res" id="btn-res" onclick="restoreNote()" style="display:none">復元</button>
      </div>
      <div id="e-body">
        <textarea id="e-input"
          placeholder="ここにメモを書いてください…&#10;&#10;マークダウン記法も使えます：&#10;# 見出し1  ## 見出し2&#10;**太字**  *斜体*  `コード`&#10;- リスト項目"
          oninput="onEdit(); updatePreview()"></textarea>
        <div id="e-preview"></div>
      </div>
    </div>
  </div>

</div>

<div id="dialog-bg">
  <div id="dialog">
    <h3>ゴミ箱に移動しますか？</h3>
    <p>30日後に自動的に完全削除されます。ゴミ箱から復元することもできます。</p>
    <div class="d-btns">
      <button onclick="closeDialog()">キャンセル</button>
      <button class="confirm" onclick="doDelete()">ゴミ箱へ移動</button>
    </div>
  </div>
</div>

<script>
const SURL = 'https://nxikzklntxagosklypbq.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54aWt6a2xudHhhZ29za2x5cGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Nzk2NzksImV4cCI6MjA5NjQ1NTY3OX0.7n0UCkqM1CFaN14m7qu9ig4kcO9kPQBuIe302toQ5R0';
const HDR  = { 'apikey': SKEY, 'Authorization': 'Bearer ' + SKEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

let notes     = [];
let trashList = [];
let currentId = null;
let inTrash   = false;
let saveTimer = null;
let query     = '';
let showPreview = false;

/* ── API ── */
async function api(method, path, body) {
  const r = await fetch(SURL + '/rest/v1/' + path, {
    method, headers: HDR,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

/* ── Boot ── */
async function boot() {
  try {
    notes = await api('GET', 'notes?order=updated_at.desc&select=id,title,content,updated_at') || [];
    setConn(true);
    renderList();
    wsConnect();
  } catch(e) { setConn(false); console.error(e); }
}

function setConn(ok) {
  const el = document.getElementById('s-conn');
  el.className = ok ? 'ok' : 'err';
  document.getElementById('conn-label').textContent = ok ? '接続済み' : '接続エラー';
}

function wsConnect() {
  const ws = new WebSocket(SURL.replace('https','wss') + '/realtime/v1/websocket?apikey=' + SKEY + '&vsn=1.0.0');
  ws.onopen = () => ws.send(JSON.stringify({ topic: 'realtime:public:notes', event: 'phx_join', payload: {}, ref: '1' }));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (['INSERT','UPDATE','DELETE'].includes(m.event)) boot();
  };
  ws.onclose = () => setTimeout(wsConnect, 3000);
}

/* ── List ── */
function renderList() {
  const el   = document.getElementById('s-list');
  const list = inTrash ? trashList : notes;
  const q    = query.toLowerCase();
  const show = list.filter(n =>
    !q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q)
  );

  if (!show.length) {
    el.innerHTML = '<div class="empty-msg">' + (inTrash ? 'ゴミ箱は空です' : 'メモなし') + '</div>';
    return;
  }

  el.innerHTML = '';
  show.forEach(n => {
    const div = document.createElement('div');
    div.className = 'nitem' + (n.id === currentId ? ' sel' : '') + (inTrash ? ' trashed' : '');
    div.innerHTML =
      '<div class="nt">' + esc(n.title || '無題のメモ') + '</div>' +
      '<div class="np">' + esc((n.content || '').replace(/[#*`>-]/g,'').slice(0, 65)) + '</div>' +
      '<div class="nd">' + (inTrash ? '削除: ' + rel(n.deleted_at) : rel(n.updated_at)) + '</div>';
    div.addEventListener('click', () => openNote(n.id));
    el.appendChild(div);
  });
}

/* ── Open note ── */
function openNote(id) {
  const list = inTrash ? trashList : notes;
  const note = list.find(n => n.id === id);
  if (!note) return;

  currentId = id;

  document.getElementById('m-empty').style.display  = 'none';
  document.getElementById('editor').style.display   = 'flex';
  document.getElementById('e-title').value          = note.title   || '';
  document.getElementById('e-input').value          = note.content || '';
  document.getElementById('e-title').disabled       = inTrash;
  document.getElementById('e-input').disabled       = inTrash;
  document.getElementById('btn-del').style.display  = inTrash ? 'none' : '';
  document.getElementById('btn-res').style.display  = inTrash ? '' : 'none';
  document.getElementById('btn-preview').style.display = inTrash ? 'none' : '';

  updatePreview();
  setStatus('');
  renderList();
  document.getElementById('sidebar').classList.remove('open');
}

/* ── Preview toggle ── */
function togglePreview() {
  showPreview = !showPreview;
  document.getElementById('btn-preview').className = showPreview ? 'ebtn active' : 'ebtn';
  document.getElementById('e-preview').style.display = showPreview ? 'block' : 'none';
  updatePreview();
}

function updatePreview() {
  if (!showPreview) return;
  const val = document.getElementById('e-input').value;
  document.getElementById('e-preview').innerHTML = marked.parse(val || '');
}

/* ── Edit / Save ── */
function onEdit() {
  if (inTrash) return;
  setStatus('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 900);
}

async function save() {
  if (!currentId || inTrash) return;
  const title   = document.getElementById('e-title').value;
  const content = document.getElementById('e-input').value;
  try {
    await api('PATCH', 'notes?id=eq.' + currentId, { title, content, updated_at: new Date().toISOString() });
    const i = notes.findIndex(n => n.id === currentId);
    if (i >= 0) Object.assign(notes[i], { title, content, updated_at: new Date().toISOString() });
    notes.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderList();
    setStatus('保存済み ✓', 'ok');
    setTimeout(() => setStatus(''), 2500);
  } catch(e) { setStatus('保存エラー', 'err'); }
}

/* ── New note ── */
async function newNote() {
  try {
    const data = await api('POST', 'notes', { title: '', content: '', updated_at: new Date().toISOString() });
    const note = Array.isArray(data) ? data[0] : data;
    notes.unshift(note);
    renderList();
    openNote(note.id);
    document.getElementById('e-title').focus();
  } catch(e) { console.error(e); }
}

/* ── Delete ── */
function askDelete() { document.getElementById('dialog-bg').className = 'show'; }
function closeDialog() { document.getElementById('dialog-bg').className = ''; }

async function doDelete() {
  closeDialog();
  if (!currentId) return;
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  try {
    await api('POST', 'trash', {
      title: note.title || '',
      content: note.content || '',
      deleted_at: new Date().toISOString()
    });
    await api('DELETE', 'notes?id=eq.' + currentId);
    notes     = notes.filter(n => n.id !== currentId);
    currentId = null;
    document.getElementById('editor').style.display  = 'none';
    document.getElementById('m-empty').style.display = 'flex';
    renderList();
  } catch(e) {
    console.error('Delete error:', e);
    setStatus('削除エラー', 'err');
  }
}

/* ── Restore ── */
async function restoreNote() {
  if (!currentId) return;
  const note = trashList.find(n => n.id === currentId);
  if (!note) return;
  try {
    await api('POST', 'notes', { title: note.title, content: note.content, updated_at: new Date().toISOString() });
    await api('DELETE', 'trash?id=eq.' + currentId);
    trashList = trashList.filter(n => n.id !== currentId);
    currentId = null;
    document.getElementById('editor').style.display  = 'none';
    document.getElementById('m-empty').style.display = 'flex';
    renderList();
  } catch(e) { console.error(e); }
}

/* ── Trash toggle ── */
async function toggleTrash() {
  inTrash   = !inTrash;
  currentId = null;
  query     = '';
  document.getElementById('search-input').value    = '';
  document.getElementById('s-label').textContent   = inTrash ? 'ゴミ箱' : 'Memo';
  document.getElementById('new-btn').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('trash-btn').className   = inTrash ? 'hbtn on' : 'hbtn';
  document.getElementById('editor').style.display  = 'none';
  document.getElementById('m-empty').style.display = 'flex';
  if (inTrash) {
    trashList = await api('GET', 'trash?order=deleted_at.desc&select=id,title,content,deleted_at,original_id') || [];
  }
  renderList();
}

/* ── Search ── */
function onSearch(v) { query = v; renderList(); }

/* ── Mobile ── */
function closeMobile() {
  document.getElementById('sidebar').classList.add('open');
  currentId = null;
  document.getElementById('editor').style.display  = 'none';
  document.getElementById('m-empty').style.display = 'flex';
  renderList();
}

/* ── Util ── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rel(iso) {
  if (!iso) return '';
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000)    return 'たった今';
  if (diff < 3600000)  return Math.floor(diff / 60000) + '分前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '時間前';
  return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
}
function setStatus(msg, cls) {
  const el = document.getElementById('e-status');
  el.textContent = msg;
  el.className   = cls || '';
}

document.getElementById('dialog-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('dialog-bg')) closeDialog();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });

boot();
</script>
</body>
</html>
