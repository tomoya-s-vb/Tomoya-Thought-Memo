<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tomoya Memo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tomoya Memo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #faf9f7; --border: #e2e0d8;
  --text: #1a1916; --text2: #6b6860; --text3: #a9a79f; --soft: #e8e6df;
  --green: #2d6a4f; --greenbg: #eaf4ee; --red: #9b2c2c; --redbg: #fdf0f0;
  --amber: #a9720b; --amberbg: #f8f0dd;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1c1b18; --border: #2e2c28;
    --text: #f0ede6; --text2: #8a877e; --text3: #4a4844; --soft: #252320;
    --green: #4ade80; --greenbg: #0d2e1a; --red: #f87171; --redbg: #2a0f0f;
    --amber: #f2c14e; --amberbg: #2b230e;
  }
}
html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); overscroll-behavior: none; }
#app {
  display: none; overflow: hidden;
  height: 100vh; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app.show { display: flex; }

/* Login screen */
#login-screen {
  height: 100vh; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
#login-screen.hide { display: none; }
#login-box { width: 100%; max-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
#login-box h1 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
#login-box p { font-size: 12px; color: var(--text3); margin-bottom: 20px; font-family: var(--mono); }
#login-box input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; outline: none; margin-bottom: 10px; }
#login-box input:focus { border-color: var(--text2); }
#login-box button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--text); color: var(--bg); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
#login-box button:hover { opacity: .9; }
#login-err { font-size: 12px; color: var(--red); margin-top: 10px; font-family: var(--mono); min-height: 16px; }

/* Sidebar (rail: search / theme filter / trash-new) */
#sidebar { width: 250px; min-width: 250px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#s-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#s-head span { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; }
#s-head-btns { display: flex; gap: 6px; }
.export-menu-wrap { position: relative; }
.export-menu { display:none; position:absolute; top:calc(100% + 4px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); overflow:hidden; z-index:30; min-width:100px; }
.export-menu.show { display:block; }
.export-menu button { display:block; width:100%; text-align:left; padding:8px 12px; border:none; background:none; font-family:var(--sans); font-size:12px; color:var(--text2); cursor:pointer; white-space:nowrap; }
.export-menu button:hover { background:var(--soft); color:var(--text); }
.hbtn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink:0; }
.hbtn:hover { background: var(--soft); color: var(--text); }
.hbtn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
#s-search { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
#s-search input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; }
#s-search input:focus { border-color: var(--text2); }
#s-search input::placeholder { color: var(--text3); }

#sort-row { padding: 0 12px 10px; display:flex; gap:6px; }
.sortbtn { flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text2); font-family:var(--mono); font-size:11px; cursor:pointer; transition:.15s; }
.sortbtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

#s-conn { margin: 0 12px 10px; font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 100px; border: 1px solid var(--border); color: var(--text3); display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
#s-conn.ok { color: var(--green); background: var(--greenbg); border-color: var(--greenbg); }
#s-conn.err { color: var(--red); background: var(--redbg); border-color: var(--redbg); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

#theme-label-row { padding: 4px 10px 4px 14px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
#theme-label { font-family:var(--mono); font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; }
#tag-sort-btns { display:flex; gap:4px; }
.tinybtn { padding:2px 7px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text3); font-family:var(--mono); font-size:10px; cursor:pointer; }
.tinybtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
#theme-list { padding: 0 10px 12px; display:flex; flex-wrap:wrap; gap:5px; overflow-y:auto; }
.theme-chip { font-size: 11px; font-family: var(--mono); padding: 4px 10px; border-radius: 100px; border:1px solid var(--border); background: var(--bg); color: var(--text2); cursor:pointer; white-space:nowrap; transition:.15s; }
.theme-chip:hover { background: var(--soft); }
.theme-chip.active { background: var(--amberbg); color: var(--amber); border-color: var(--amberbg); }
.theme-chip.dragging { opacity: .35; }
.theme-chip.drop-target { border-color: var(--green); }

/* Folder zone */
#folder-label-row { padding: 4px 10px 4px 14px; font-family:var(--mono); font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; }
#folder-list { padding: 2px 10px 6px; display:flex; flex-direction:column; gap:2px; }
.folder-row { display:flex; align-items:center; gap:4px; padding:4px 6px; border-radius:6px; cursor:pointer; transition:.15s; }
.folder-row:hover { background: var(--soft); }
.folder-row.active { background: var(--amberbg); }
.folder-row.active .folder-name { color: var(--amber); font-weight: 500; }
.folder-row.folder-drop-hover { outline: 2px solid var(--green); outline-offset: -2px; }
.folder-name { flex:1; font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.folder-actions { display:flex; gap:2px; flex-shrink:0; }
.folder-actions button { width:18px; height:18px; border:none; background:none; color:var(--text3); font-size:10px; cursor:pointer; border-radius:4px; display:flex; align-items:center; justify-content:center; }
.folder-actions button:hover { background: var(--border); color: var(--text); }
.folder-actions button.confirm-del { color: var(--red); font-size: 9px; width: auto; padding: 0 4px; }
.folder-rename-input { flex:1; font-size:12px; font-family:var(--sans); background:var(--bg); border:1px solid var(--text2); border-radius:4px; padding:1px 5px; color:var(--text); outline:none; }
#folder-add-row { padding: 2px 10px 10px; }
#folder-add-row input { width:100%; padding:5px 9px; border:1px dashed var(--border); border-radius:6px; background:none; color:var(--text2); font-family:var(--sans); font-size:12px; outline:none; }
#folder-add-row input:focus { border-style:solid; border-color:var(--text2); }
#folder-add-row input::placeholder { color:var(--text3); }

#s-foot { margin-top:auto; padding: 10px 12px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px; }
#s-foot span { font-size:10px; font-family:var(--mono); color:var(--text3); }
#logout-btn { font-size:10px; font-family:var(--mono); color:var(--text3); background:none; border:none; cursor:pointer; text-decoration:underline; flex-shrink:0; }
#logout-btn:hover { color: var(--text); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position:relative; }

/* Grid of cards */
#grid-wrap { flex:1; overflow-y:auto; scrollbar-gutter: stable; }
#grid { padding: 18px; }
.group-section + .group-section { margin-top: 6px; }
.group-label { font-family: var(--mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; padding: 0 2px 10px; }
.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-content: start; margin-bottom: 22px; }
.group-list { margin-bottom: 10px; }
.group-grid.group-empty { min-height: 56px; }
.empty-hint { grid-column: 1/-1; border: 1px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; font-size: 12px; color: var(--text3); }
.empty-msg { padding: 40px 20px; font-size: 13px; color: var(--text3); text-align: center; font-family: var(--mono); grid-column: 1/-1; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 13px 15px; height: 168px; display: flex; flex-direction: column;
  cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .1s; position: relative;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.card:hover { box-shadow: 0 3px 14px rgba(0,0,0,.07); border-color: var(--text3); }
.card.trashed { opacity: .6; }
.card.dragging { opacity: .35; transform: scale(.97); }
.card.drag-enabled { cursor: grab; touch-action: pan-y; }
.card.drop-before { box-shadow: -3px 0 0 var(--green) inset; }
.card.drop-after  { box-shadow:  3px 0 0 var(--green) inset; }
.card-title { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right:40px; margin-bottom: 6px; }
.card-body { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.65; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; }
.card-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 8px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; overflow: hidden; max-height: 19px; }
.tag-chip { font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 100px; background: var(--soft); color: var(--text2); white-space: nowrap; }
.card-date { font-size: 10px; font-family: var(--mono); color: var(--text3); white-space: nowrap; flex-shrink:0; }

.pin-btn { width: 20px; height: 20px; border: none; background: none; padding: 0; cursor: pointer; font-size: 12px; opacity: .25; filter: grayscale(1); transition: .15s; flex-shrink: 0; }
.pin-btn:hover { opacity: .7; }
.pin-btn.active { opacity: 1; filter: none; }
.card .pin-btn { position: absolute; top: 8px; right: 9px; }
.card:has(.pin-btn.active) { border-color: var(--amber); }
.pending-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
.card .pending-dot { position: absolute; top: 12px; left: 12px; }

/* Editor: centered modal on desktop */
#editor { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
#editor.open { display: flex; }
#editor-card { background: var(--bg); border-radius: 12px; width: 100%; max-width: 640px; height: 80vh; max-height: 700px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
#e-bar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
#e-back { display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:var(--text2); font-size:13px; font-family:var(--sans); padding:4px 2px; flex-shrink:0; }
#e-back:hover { color: var(--text); }
#e-title { flex: 1; min-width:140px; background: none; border: none; font-size: 16px; font-weight: 500; font-family: var(--sans); color: var(--text); outline: none; }
#e-title::placeholder { color: var(--text3); font-weight: 300; }
#e-folder-row { display: flex; align-items: center; gap: 8px; padding: 8px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#e-folder-icon { font-size: 13px; opacity: .7; }
#e-folder-select { flex: 1; max-width: 220px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text2); font-family: var(--sans); font-size: 12px; outline: none; }
#e-folder-select:focus { border-color: var(--text2); }
#e-tags-row { padding: 10px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
#e-tags-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
#e-tags-chips:empty { margin-bottom: 0; }
.tag-chip.removable { display: inline-flex; align-items: center; gap: 4px; }
.tag-chip.removable button { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; padding: 0; line-height: 1; }
.tag-chip.removable button:hover { color: var(--red); }
#e-tag-input-wrap { display: flex; }
#e-tag-input { width: 100%; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; font-family: var(--mono); color: var(--text2); outline: none; }
#e-tag-input:focus { border-color: var(--text2); }
#e-tag-input::placeholder { color: var(--text3); }
#e-tag-suggest { display: none; position: absolute; left: 18px; right: 18px; top: 100%; margin-top: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.1); z-index: 10; overflow: hidden; }
.tag-suggest-item { padding: 8px 12px; font-size: 12.5px; cursor: pointer; }
.tag-suggest-item:hover { background: var(--soft); }
#e-status { font-size: 11px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
#e-status.ok { color: var(--green); }
#e-status.err { color: var(--red); }
.ebtn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text2); font-size: 12px; font-family: var(--mono); cursor: pointer; transition: .15s; }
.ebtn:hover { background: var(--soft); color: var(--text); }
.ebtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.ebtn.del:hover { background: var(--redbg); color: var(--red); border-color: var(--redbg); }
.ebtn.res:hover { background: var(--greenbg); color: var(--green); border-color: var(--greenbg); }

#e-body { flex: 1; display: flex; overflow: hidden; }
#e-input {
  flex: 1; padding: 20px 24px; border: none; background: none; resize: none;
  font-size: 14px; line-height: 1.85; font-family: var(--mono); font-weight: 300;
  color: var(--text); outline: none; overflow-y: auto;
}
#e-input::placeholder { color: var(--text3); }
#e-preview {
  flex: 1; padding: 20px 24px; overflow-y: auto; font-size: 14px; line-height: 1.85;
  font-weight: 300; border-left: 1px solid var(--border); display: none;
}
#e-preview h1 { font-size: 1.6em; font-weight: 500; margin: .4em 0 .3em; padding-bottom: .2em; border-bottom: 1px solid var(--border); line-height: 1.3; }
#e-preview h2 { font-size: 1.3em; font-weight: 500; margin: .6em 0 .2em; line-height: 1.3; }
#e-preview h3 { font-size: 1.1em; font-weight: 500; margin: .5em 0 .2em; }
#e-preview p { margin: .35em 0; }
#e-preview ul, #e-preview ol { padding-left: 1.4em; margin: .3em 0; }
#e-preview li { margin: .1em 0; }
#e-preview strong { font-weight: 500; }
#e-preview em { font-style: italic; }
#e-preview code { font-family: var(--mono); font-size: .87em; background: var(--soft); padding: .1em .35em; border-radius: 4px; }
#e-preview pre { background: var(--soft); padding: .8em 1em; border-radius: 6px; margin: .4em 0; overflow-x: auto; }
#e-preview pre code { background: none; padding: 0; }
#e-preview blockquote { border-left: 3px solid var(--border); padding-left: .8em; color: var(--text2); margin: .4em 0; }
#e-preview a { color: var(--green); }
#e-preview hr { border: none; border-top: 1px solid var(--border); margin: .6em 0; }
#e-preview table { border-collapse: collapse; width: 100%; font-size: 13px; margin: .4em 0; }
#e-preview th, #e-preview td { border: 1px solid var(--border); padding: 5px 9px; }
#e-preview th { background: var(--soft); font-weight: 500; }

/* Dialog */
#dialog-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; align-items: center; justify-content: center; }
#dialog-bg.show { display: flex; }
#dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 26px; width: 320px; }
#dialog h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
#dialog p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 18px; }
.d-btns { display: flex; gap: 8px; justify-content: flex-end; }
.d-btns button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: none; font-family: var(--sans); font-size: 13px; color: var(--text); cursor: pointer; }
.d-btns button.confirm { background: var(--red); color: #fff; border-color: var(--red); }
.d-btns button.confirm.ai { background: var(--green); border-color: var(--green); }

/* AI organize preview dialog */
#ai-dialog-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; align-items: center; justify-content: center; padding: 20px; }
#ai-dialog-bg.show { display: flex; }
#ai-dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; width: 100%; max-width: 520px; }
#ai-dialog h3 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
#ai-dialog p { font-size: 12px; color: var(--text3); margin-bottom: 12px; }
#ai-dialog-text { width: 100%; height: 260px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.7; resize: vertical; outline: none; margin-bottom: 14px; }
#ai-dialog-text:focus { border-color: var(--text2); }

/* AI-ask answer panel */
#ai-answer-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; align-items: center; justify-content: center; padding: 20px; }
#ai-answer-bg.show { display: flex; }
#ai-answer-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; width: 100%; max-width: 480px; max-height: 80vh; overflow-y: auto; }
#ai-answer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
#ai-answer-q { font-family: var(--mono); font-size: 11px; color: var(--amber); }
#ai-answer-head button { border: none; background: none; color: var(--text3); cursor: pointer; font-size: 13px; }
#ai-answer-body { font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
#ai-answer-refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; margin-bottom: 14px; }
#ai-answer-refs .ref-chip { font-size: 11px; font-family: var(--mono); padding: 3px 9px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer; }
#ai-answer-refs .ref-chip:hover { background: var(--soft); }

/* Shared full-width sidebar action button (synthesize) */
#synth-row, #mob-synth-row { padding: 4px 10px 12px; }
.hbtn-wide { width: 100%; padding: 8px; border: 1px dashed var(--border); border-radius: 8px; background: none; color: var(--text2); font-family: var(--sans); font-size: 12px; cursor: pointer; }
.hbtn-wide:hover { background: var(--soft); }
.hbtn-wide:disabled { opacity: .35; cursor: default; }
.hbtn-wide:disabled:hover { background: none; }
#mob-synth-row { padding: 8px 16px; border-bottom: 1px solid var(--border); display: none; }

/* List view (alternative to card grid) */
#grid.list-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 18px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.row:hover { background: var(--soft); }
.row.trashed { opacity: .6; }
.row.dragging { opacity: .35; }
.row.drag-enabled { touch-action: pan-y; }
.row.drop-before { box-shadow: 0 -3px 0 var(--green) inset; }
.row.drop-after  { box-shadow: 0  3px 0 var(--green) inset; }
.row-title { font-size: 13.5px; font-weight: 500; flex-shrink: 0; width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-body { flex: 1; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-tags { display: flex; gap: 4px; flex-shrink: 0; }
.row-date { font-size: 10px; font-family: var(--mono); color: var(--text3); flex-shrink: 0; width: 60px; text-align: right; }

/* Mobile top bar / search / tags (hidden on desktop) */
#mob-topbar { display: none; }
#mob-search { display: none; }
#mob-tags-row { display: none; }
#mob-folder-row { display: none; }

/* Mobile */
@media (max-width: 640px) {
  #sidebar { display: none; }
  #mob-topbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #mob-title { font-size: 14px; font-weight: 500; flex: 1; text-align: center; }
  #mob-search { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #mob-search input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); outline: none; }
  #mob-search input::placeholder { color: var(--text3); }
  #mob-synth-row { display: block; }
  #mob-tags-row { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #mob-tags-row .tinybtn { flex-shrink: 0; }
  #mob-theme-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
  #mob-theme-list .theme-chip { flex-shrink: 0; }
  #mob-folder-row { display: block; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #mob-folder-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  #mob-folder-list .folder-chip { flex-shrink: 0; font-size: 11px; font-family: var(--mono); padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); white-space: nowrap; }
  #mob-folder-list .folder-chip.active { background: var(--amberbg); color: var(--amber); border-color: var(--amberbg); }
  #mob-folder-list .folder-chip.folder-drop-hover { outline: 2px solid var(--green); outline-offset: -2px; }
  #e-body.preview-mode #e-input { display: none; }
  #e-body.preview-mode #e-preview { display: block; width: 100%; border-left: none; }
  #grid { padding: 12px; }
  .group-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { height: 140px; }
  .row-title { width: auto; flex: 1; }
  .row-body { display: none; }

  /* Editor: full-screen instead of centered modal */
  #editor { background: none; padding: 0; align-items: stretch; }
  #editor-card {
    max-width: none; width: 100%; height: 100%; max-height: none; border-radius: 0;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }

  /* Toolbar: back+preview+delete pinned on row 1, title on its own row 2 —
     this way "保存済み" appearing never pushes preview/delete out of place,
     and delete sits away from the back button so it's harder to mis-tap. */
  #e-bar { position: relative; }
  #e-back { order: 1; }
  #btn-organize { order: 2; margin-left: auto; }
  #btn-preview { order: 3; }
  #btn-del, #btn-res { order: 4; }
  #e-title { order: 5; flex-basis: 100%; }
  #e-status { position: absolute; top: 38px; left: 18px; background: var(--surface); padding: 2px 7px; border-radius: 5px; z-index: 5; }

  /* Prevent iOS Safari auto-zoom on focus (needs >=16px font-size on inputs) */
  #search-input, #mob-search-input, #e-title, #e-tag-input, #e-input, #login-email, #login-pass { font-size: 16px; }
}
</style>

<body>

        <button class="tinybtn" id="tag-sort-manual" onclick="setTagSortMode('manual')" title="手動並び替え">↕</button>

      <button class="hbtn" id="mob-trash-btn" title="ゴミ箱" onclick="toggleTrash()">🗑</button>
      <button class="hbtn" id="mob-view-btn" title="表示切替" onclick="toggleView()">▦</button>
      <span id="mob-title">Tomoya Memo</span>
      <div class="export-menu-wrap">
        <button class="hbtn" title="エクスポート" onclick="toggleExportMenu('mob-export-menu')">⬇</button>
        <div id="mob-export-menu" class="export-menu">

<script>
/* ── Script map ──
   Auth & boot ............. login, session, initial data load, realtime wiring
   Offline drafts ........... localStorage-backed draft queue + sync/conflict logic
   Settings ................. per-account sort preferences (synced via Supabase)
   Tag filter ................ sidebar/mobile tag chips, filtering, manual order
   Grid rendering ............ pinned/unpinned groups, card vs list layout
   Drag to reorder ........... pointer-based drag (mouse + long-press touch)
   Editor ..................... open/close, tag chips, save, offline-aware create
   Trash ...................... delete/restore
   Small helpers ............. esc/rel/setStatus etc

   Note: the database column is called "theme" (kept from an earlier design),
   but the UI presents it to the user as "tag" (タグ). Variable/function names
   below mostly follow the DB column name — this comment is the only place
   that mapping is spelled out. */

/* ▼▼ ここを新しいプロジェクトのURL / anon keyに差し替えてください ▼▼ */
const SUPABASE_URL = 'https://itvumfppblhirvbuynwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iOkh_MHaXukHHDHV8d8Shw__rwczL54';
/* ▲▲ ここまで ▲▲ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* Auto-linked URLs in the preview pane always open in a new tab (target=_blank),
   so reading a note never navigates the app itself away. On mobile, a real <a>
   also gets Safari's native long-press "Open / Share" menu automatically. */
{
  const linkRenderer = new marked.Renderer();
  const originalLink = linkRenderer.link.bind(linkRenderer);
  linkRenderer.link = (href, title, text) => originalLink(href, title, text).replace('<a ', '<a target="_blank" rel="noopener noreferrer" ');
  marked.use({ renderer: linkRenderer });
}

let notes = [], trashList = [], currentId = null, inTrash = false, saveTimer = null;
let query = '', showPreview = false, sortMode = 'manual', activeTheme = null, dragMoved = false;
let uid = null, viewMode = 'grid';

/* Folder filter state: FOLDER_ALL means "no folder filter" (default, shows
   everything); FOLDER_UNFILED is a pseudo-folder id for notes with no
   folder_id. Both are fixed entries always shown above the real folders. */
const FOLDER_ALL = null;
const FOLDER_UNFILED = '__unfiled__';
let folders = [];
let activeFolder = FOLDER_ALL;

/* ── Auth ──
   Realtime with RLS needs the session's access token explicitly handed to the
   realtime client (sb.realtime.setAuth). Without this, postgres_changes events
   are silently dropped for RLS-protected tables — this was missing before and
   is why changes weren't syncing across devices. */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = 'ログインできませんでした: ' + error.message; return; }
  uid = data.user.id;
  await sb.realtime.setAuth(data.session.access_token);
  enterApp();
}
async function doLogout() {
  await sb.auth.signOut();
  uid = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hide');
}

/* Force a fresh fetch of index.html etc, bypassing any HTTP cache, so a just-
   pushed deploy shows up immediately instead of a possibly-cached old copy. */
function hardRefresh() {
  location.href = location.pathname + '?_=' + Date.now();
}

/* ── Export ──
   Always exports every note (not just whatever's currently filtered/visible),
   since this is meant as a full backup/handoff, not a filtered printout. */
function toggleExportMenu(menuId) {
  const menu = document.getElementById(menuId);
  const wasOpen = menu.classList.contains('show');
  document.querySelectorAll('.export-menu').forEach(m => m.classList.remove('show'));
  if (!wasOpen) menu.classList.add('show');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.export-menu-wrap')) {
    document.querySelectorAll('.export-menu').forEach(m => m.classList.remove('show'));
  }
});

function folderNameFor(folderId) {
  if (!folderId) return '';
  const f = folders.find(x => x.id === folderId);
  return f ? f.name : '';
}

function exportNotes(format) {
  document.querySelectorAll('.export-menu').forEach(m => m.classList.remove('show'));
  const sorted = [...notes].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

  let text, mime, ext;
  if (format === 'json') {
    text = JSON.stringify(sorted.map(n => ({
      title: n.title || '',
      content: n.content || '',
      tags: n.theme || [],
      folder: folderNameFor(n.folder_id) || null,
      pinned: !!n.pinned,
      updated_at: n.updated_at
    })), null, 2);
    mime = 'application/json';
    ext = 'json';
  } else if (format === 'md') {
    text = sorted.map(n => {
      const meta = [];
      if (n.theme && n.theme.length) meta.push('タグ: ' + n.theme.join(', '));
      const fn = folderNameFor(n.folder_id);
      if (fn) meta.push('フォルダ: ' + fn);
      return '# ' + (n.title || '無題のメモ') + '\n\n' + (meta.length ? '_' + meta.join(' / ') + '_\n\n' : '') + (n.content || '');
    }).join('\n\n---\n\n');
    mime = 'text/markdown';
    ext = 'md';
  } else {
    text = sorted.map(n => {
      const meta = [];
      if (n.theme && n.theme.length) meta.push('タグ: ' + n.theme.join(', '));
      const fn = folderNameFor(n.folder_id);
      if (fn) meta.push('フォルダ: ' + fn);
      return (n.title || '無題のメモ') + '\n' + '-'.repeat(30) + (meta.length ? '\n' + meta.join(' / ') : '') + '\n\n' + (n.content || '');
    }).join('\n\n\n');
    mime = 'text/plain';
    ext = 'txt';
  }

  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tomoya-memo-export-' + new Date().toISOString().slice(0, 10) + '.' + ext;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ── Claude integration ──
   All three features go through one Edge Function (claude-proxy) that holds
   the Anthropic API key server-side — the browser only ever sends the user's
   own Supabase session token, never the API key itself. */
async function callClaude(task, payload) {
  const { data, error } = await sb.functions.invoke('claude-proxy', { body: { task, ...payload } });
  if (error) throw error;
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* Notes visible under the current tag/folder filter, ignoring the search box
   text — used as the corpus for synthesize/ask, where that text is the
   article topic or the question itself, not a keyword filter. */
function getFilteredForAI() {
  return notes.filter(n =>
    (!activeTheme || (n.theme || []).includes(activeTheme)) &&
    (activeFolder === FOLDER_ALL || (activeFolder === FOLDER_UNFILED ? !n.folder_id : n.folder_id === activeFolder))
  );
}

/* ── ① Organize / clean up a note (whole note, or just the selected text) ── */
async function organizeNote() {
  if (!currentId || inTrash) return;
  const input = document.getElementById('e-input');
  const hasSelection = input.selectionStart !== input.selectionEnd;
  const range = hasSelection ? { start: input.selectionStart, end: input.selectionEnd } : null;
  const text = hasSelection ? input.value.slice(range.start, range.end) : input.value;
  if (!text.trim()) return;

  const btn = document.getElementById('btn-organize');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = '整理中…';
  try {
    const data = await callClaude('organize', { text });
    openAIDialog(
      hasSelection ? '✨ 選択範囲の整理案' : '✨ 整理案',
      '内容を確認・編集してから採用してください。',
      data.result || '',
      finalText => {
        if (range) input.setRangeText(finalText, range.start, range.end, 'end');
        else input.value = finalText;
        onEdit();
        updatePreview();
      }
    );
  } catch(e) {
    alert('整理に失敗しました: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

/* Generic "review Claude's suggestion, edit if needed, then apply" dialog,
   shared by any feature that shouldn't silently overwrite text. */
let aiDialogApplyFn = null;
function openAIDialog(title, hint, text, onApply) {
  document.getElementById('ai-dialog-title').textContent = title;
  document.getElementById('ai-dialog-hint').textContent = hint;
  document.getElementById('ai-dialog-text').value = text;
  aiDialogApplyFn = onApply;
  document.getElementById('ai-dialog-bg').classList.add('show');
}
function closeAIDialog() {
  document.getElementById('ai-dialog-bg').classList.remove('show');
  aiDialogApplyFn = null;
}
function applyAIDialog() {
  const text = document.getElementById('ai-dialog-text').value;
  if (aiDialogApplyFn) aiDialogApplyFn(text);
  closeAIDialog();
}

/* ── ③ Synthesize whatever's currently filtered into one note.com-style draft ── */
function updateSynthButtonState() {
  const active = !inTrash && !(activeFolder === FOLDER_ALL && !activeTheme);
  ['synth-btn', 'mob-synth-btn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !active;
  });
}

async function synthesizeArticle() {
  if (activeFolder === FOLDER_ALL && !activeTheme) {
    alert('先にタグかフォルダで絞り込んでください。');
    return;
  }
  const corpus = getFilteredForAI();
  if (!corpus.length) { alert('絞り込み範囲に対象のメモがありません。'); return; }

  const guideNote = notes.find(n => (n.theme || []).includes('スタイルガイド'));
  const styleGuide = guideNote ? guideNote.content : '';

  const btns = ['synth-btn', 'mob-synth-btn'].map(id => document.getElementById(id)).filter(Boolean);
  btns.forEach(b => { b.disabled = true; b.textContent = '生成中…'; });
  try {
    const payload = corpus.map(n => ({ title: n.title, content: n.content }));
    const data = await callClaude('synthesize', { notes: payload, styleGuide });
    await createDraftNote(data.title || '無題の記事', data.content || '');
  } catch(e) {
    alert('記事化に失敗しました: ' + e.message);
  } finally {
    btns.forEach(b => { b.disabled = false; b.textContent = '✨ この絞り込みで記事化'; });
    updateSynthButtonState();
  }
}

async function createDraftNote(title, content) {
  const id = crypto.randomUUID();
  const minOrder = notes.reduce((m, n) => Math.min(m, n.sort_order ?? 0), 0);
  const updatedAt = new Date().toISOString();
  try {
    const { data, error } = await sb.from('notes').insert({
      id, user_id: uid, title, content, theme: ['AI下書き'], pinned: false, folder_id: null,
      sort_order: minOrder - 1, updated_at: updatedAt
    }).select().single();
    if (error) throw error;
    notes.unshift(data);
    renderThemes();
    renderGrid();
    openNote(data.id);
  } catch(e) {
    alert('メモの作成に失敗しました: ' + e.message);
  }
}

/* ── ⑤ Ask a question over the currently-filtered notes ── */
async function askAI() {
  const question = query.trim();
  if (!question) { alert('検索欄に質問を入力してください。'); return; }
  const corpus = getFilteredForAI();
  if (!corpus.length) { alert('検索対象のメモがありません。'); return; }

  const btns = ['ask-btn', 'mob-ask-btn'].map(id => document.getElementById(id)).filter(Boolean);
  btns.forEach(b => { b.disabled = true; });
  try {
    const payload = corpus.map(n => ({ title: n.title, content: n.content }));
    const data = await callClaude('ask', { question, notes: payload });
    const refs = (data.referenced || []).map(i => corpus[i - 1]).filter(Boolean);
    showAIAnswer(question, data.answer || '', refs);
  } catch(e) {
    showAIAnswer(question, '質問に失敗しました: ' + e.message, []);
  } finally {
    btns.forEach(b => { b.disabled = false; });
  }
}

async function refreshQuietly() {

/* ── Offline drafts ──
   Every keystroke writes the current edit to localStorage immediately (not
   debounced), independent of the network save. This is what survives
   navigating back to the list — or even closing the tab — while offline; the
   network save is just an attempt to sync it, and can fail without losing
   the draft itself. A draft's `type` is 'create' for a note that doesn't
   exist on the server yet (made offline) and 'update' otherwise. */
const PENDING_PREFIX = 'pendingEdit:';
function pendingKey(id) { return PENDING_PREFIX + id; }
function savePendingDraft(id, draft) {
  try { localStorage.setItem(pendingKey(id), JSON.stringify(draft)); } catch(e) {}
}
function loadPendingDraft(id) {
  try { const raw = localStorage.getItem(pendingKey(id)); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function clearPendingDraft(id) {
  try { localStorage.removeItem(pendingKey(id)); } catch(e) {}
}
function hasPendingDraft(id) {
  try { return localStorage.getItem(pendingKey(id)) !== null; } catch(e) { return false; }
}
/* Snapshot of what a local note needs for a future create/update, taken fresh
   at the moment of writing the draft (not tracked in separate globals). */
function draftFor(id, type, fields) {
  const localNote = notes.find(n => n.id === id);
  return {
    type,
    title: fields.title, content: fields.content, theme: fields.theme,
    baseUpdatedAt: editBaseUpdatedAt,
    sort_order: localNote ? localNote.sort_order : 0,
    pinned: localNote ? !!localNote.pinned : false,
    folder_id: localNote ? (localNote.folder_id || null) : null
  };
}

/* Attempt to sync one note's fields to the server:
   - isNew: insert it for the first time, using the id generated on-device.
   - otherwise: check for a conflicting server-side change since baseUpdatedAt,
     forking into a new note instead of overwriting if one is found.
   Shared by both the interactive save and the background flush of drafts. */
async function attemptSyncNote(id, fields, opts) {
  if (opts.isNew) {
    const { data, error } = await sb.from('notes').insert({
      id, user_id: uid, title: fields.title, content: fields.content, theme: fields.theme,
      pinned: !!opts.pinned, folder_id: opts.folderId || null, sort_order: opts.sort_order, updated_at: new Date().toISOString()
    }).select().single();
    if (error) throw error;
    const i = notes.findIndex(n => n.id === id);
    if (i >= 0) { delete notes[i].__pendingCreate; Object.assign(notes[i], data); }
    else notes.unshift(data);
    return { mode: 'created', updatedAt: data.updated_at };
  }

  const { data: current, error: checkErr } = await sb.from('notes').select('updated_at,title,content,theme').eq('id', id).maybeSingle();
  if (checkErr) throw checkErr;
  if (!current) return { mode: 'deleted' }; // note no longer exists server-side — nothing to sync into

  if (opts.baseUpdatedAt && current.updated_at !== opts.baseUpdatedAt) {
    // A stale leftover draft (e.g. from a session that closed before its save
    // finished) can look like a conflict even though its content already
    // matches what's on the server — nothing was actually lost, so just drop
    // it instead of forking a needless copy.
    const sameContent = current.title === fields.title && current.content === fields.content &&
      JSON.stringify(current.theme || []) === JSON.stringify(fields.theme || []);
    if (sameContent) {
      const i = notes.findIndex(n => n.id === id);
      if (i >= 0) Object.assign(notes[i], current);
      return { mode: 'noop', updatedAt: current.updated_at };
    }

    const minOrder = notes.reduce((m,n) => Math.min(m, n.sort_order ?? 0), 0);
    const { data: copy, error: copyErr } = await sb.from('notes').insert({
      user_id: uid,
      title: (fields.title || '無題のメモ') + '(競合コピー)',
      content: fields.content, theme: fields.theme,
      sort_order: minOrder - 1, updated_at: new Date().toISOString()
    }).select().single();
    if (copyErr) throw copyErr;
    notes.unshift(copy);
    return { mode: 'fork', copy };
  }

  const { data: updated, error } = await sb.from('notes')
    .update({ ...fields, updated_at: new Date().toISOString() })
    .eq('id', id)
    .select('updated_at')
    .single();
  if (error) throw error;
  const updatedAt = updated.updated_at; // DB-returned value — matches what a later SELECT will read back
  const i = notes.findIndex(n => n.id === id);
  if (i >= 0) Object.assign(notes[i], { ...fields, updated_at: updatedAt });
  return { mode: 'update', updatedAt };
}

async function flushPendingEdits() {
  if (!navigator.onLine || !uid) return;
  let keys;
  try { keys = Object.keys(localStorage).filter(k => k.startsWith(PENDING_PREFIX)); } catch(e) { return; }
  for (const key of keys) {
    const id = key.slice(PENDING_PREFIX.length);
    const draft = loadPendingDraft(id);
    if (draft) await flushOneDraft(id, draft);
  }
}

async function flushOneDraft(id, draft) {
  return enqueueSave(async () => {
    try {
      const result = await attemptSyncNote(id, { title: draft.title, content: draft.content, theme: draft.theme }, {
        isNew: draft.type === 'create',
        baseUpdatedAt: draft.baseUpdatedAt,
        sort_order: draft.sort_order,
        pinned: draft.pinned,
        folderId: draft.folder_id
      });
      clearPendingDraft(id);
      if (result.mode === 'fork' && currentId === id) {
        currentId = result.copy.id;
        editBaseUpdatedAt = result.copy.updated_at;
        document.getElementById('e-title').value = result.copy.title;
      } else if ((result.mode === 'update' || result.mode === 'created' || result.mode === 'noop') && currentId === id) {
        editBaseUpdatedAt = result.updatedAt;
      }
      renderThemes();
      renderGrid();
    } catch(e) { console.error('flush pending draft failed', e); } // still offline/unreachable — leave it queued
  });
}

/* If the note currently open in the editor changed on another device, pull the
   new content in live — but only when this device has no unsaved local edits
   and isn't actively focused in one of the fields, so we never clobber typing. */
function refreshOpenEditorIfIdle() {
  if (!currentId || inTrash || saveTimer || hasPendingDraft(currentId)) return;
  const active = document.activeElement;
  if (['e-title', 'e-input', 'e-tag-input'].includes(active && active.id)) return;
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  document.getElementById('e-title').value = note.title || '';
  document.getElementById('e-input').value = note.content || '';
  currentTags = [...(note.theme || [])];
  renderTagChips();
  updatePreview();
  editBaseUpdatedAt = note.updated_at; // we're now showing the latest — no conflict against this version
}

/* ── Settings (sort preferences), stored per-account in Supabase so every
   device shows the same state instead of a browser-local preference. ── */
async function loadSettings() {
  let { data } = await sb.from('user_settings').select('*').eq('user_id', uid).maybeSingle();
  if (!data) {
    const { data: created } = await sb.from('user_settings').insert({ user_id: uid }).select().single();
    data = created;
  }
  // Note sort mode always starts at "updated order" on a fresh app open — it's
  // the more predictable default. It's still synced live across devices
  // during an active session (see wireSettingsRealtime/applySettings below).
  tagOrder = data ? (data.tag_order || []) : [];
  setTagSortMode(data ? (data.tag_sort_mode || 'alpha') : 'alpha', false);
  setSortMode('auto', false);
}

function applySettings(row) {
  if (!row) return;
  setSortMode(row.note_sort_mode || 'manual', false);
  tagOrder = row.tag_order || [];
  setTagSortMode(row.tag_sort_mode || 'alpha', false);
}

async function saveSettings(partial) {
  if (!uid) return;
  try { await sb.from('user_settings').update(partial).eq('user_id', uid); } catch(e) { console.error('settings save error', e); }
}

let settingsRealtimeWired = false;
function wireSettingsRealtime() {
  if (settingsRealtimeWired) return;
  settingsRealtimeWired = true;
  sb.channel('settings-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'user_settings' }, payload => {
      applySettings(payload.new);
      renderThemes();
