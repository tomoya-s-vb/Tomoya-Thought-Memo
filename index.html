<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #faf9f7; --border: #e2e0d8; --border-soft: #ece9e2;
  --text: #1a1916; --text-2: #6b6860; --text-3: #a9a79f; --accent-soft: #e8e6df;
  --green: #2d6a4f; --green-bg: #eaf4ee; --red: #9b2c2c; --red-bg: #fdf0f0;
  --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace; --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1c1b18; --border: #2e2c28; --border-soft: #252320;
    --text: #f0ede6; --text-2: #8a877e; --text-3: #4a4844; --accent-soft: #252320;
    --green: #4ade80; --green-bg: #0d2e1a; --red: #f87171; --red-bg: #2a0f0f;
  }
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; }
#app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
#sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
#sidebar-top { padding: 18px 16px 14px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#sidebar-top h1 { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); font-family: var(--font-mono); }
.icon-btn { width: 28px; height: 28px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-2); font-size: 16px; transition: background 0.15s, color 0.15s; flex-shrink: 0; }
.icon-btn:hover { background: var(--accent-soft); color: var(--text); }
.top-btns { display: flex; gap: 6px; }
#search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
#search { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 11px; font-size: 13px; font-family: var(--font-sans); color: var(--text); outline: none; transition: border-color 0.15s; }
#search::placeholder { color: var(--text-3); }
#search:focus { border-color: var(--text-2); }
#conn-status { margin: 8px 14px 4px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--font-mono); color: var(--text-3); padding: 3px 8px; border-radius: 100px; border: 1px solid var(--border-soft); width: fit-content; }
#conn-status.ok { color: var(--green); border-color: var(--green-bg); background: var(--green-bg); }
#conn-status.err { color: var(--red); border-color: var(--red-bg); background: var(--red-bg); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
#notes-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
#notes-list::-webkit-scrollbar { width: 4px; }
#notes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.note-item { padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--border-soft); transition: background 0.1s; position: relative; }
.note-item:hover { background: var(--accent-soft); }
.note-item.active { background: var(--bg); }
.note-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--text); border-radius: 0 1px 1px 0; }
.ni-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.ni-preview { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
.ni-date { font-size: 11px; color: var(--text-3); margin-top: 4px; font-family: var(--font-mono); }
.empty-list { padding: 24px 16px; font-size: 13px; color: var(--text-3); text-align: center; font-family: var(--font-mono); }
.trash-item { opacity: 0.7; }
.trash-badge { font-size: 10px; color: var(--red); font-family: var(--font-mono); margin-top: 3px; }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
#empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-3); gap: 10px; font-family: var(--font-mono); font-size: 13px; }
#editor { display: none; flex: 1; flex-direction: column; overflow: hidden; }
#editor-bar { padding: 12px 20px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#title-input { flex: 1; background: none; border: none; font-size: 16px; font-weight: 500; font-family: var(--font-sans); color: var(--text); outline: none; min-width: 120px; }
#title-input::placeholder { color: var(--text-3); font-weight: 300; }
#save-status { font-size: 11px; font-family: var(--font-mono); color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
#save-status.saved { color: var(--green); }
#save-status.error { color: var(--red); }
.bar-btns { display: flex; gap: 6px; align-items: center; }
.bar-btn { background: none; border: 1px solid var(--border); cursor: pointer; color: var(--text-2); padding: 5px 10px; border-radius: var(--radius); font-size: 12px; font-family: var(--font-mono); transition: all 0.15s; white-space: nowrap; }
.bar-btn:hover { background: var(--accent-soft); color: var(--text); }
.bar-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.bar-btn.danger:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }
.bar-btn.restore-btn:hover { background: var(--green-bg); color: var(--green); border-color: var(--green-bg); }

/* Editor area */
#editor-body { flex: 1; display: flex; overflow: hidden; }
#content-input { flex: 1; padding: 20px 24px; background: none; border: none; resize: none; font-size: 14.5px; line-height: 1.85; font-family: var(--font-sans); font-weight: 300; color: var(--text); outline: none; overflow-y: auto; }
#content-input::-webkit-scrollbar { width: 4px; }
#content-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
#content-input::placeholder { color: var(--text-3); }
#preview-pane { flex: 1; padding: 20px 24px; overflow-y: auto; font-size: 14.5px; line-height: 1.85; font-weight: 300; display: none; }
#preview-pane::-webkit-scrollbar { width: 4px; }
#preview-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Markdown preview styles */
#preview-pane h1 { font-size: 1.5em; font-weight: 500; margin: 0.8em 0 0.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#preview-pane h2 { font-size: 1.3em; font-weight: 500; margin: 0.8em 0 0.4em; }
#preview-pane h3 { font-size: 1.1em; font-weight: 500; margin: 0.6em 0 0.3em; }
#preview-pane p { margin: 0.5em 0; }
#preview-pane ul, #preview-pane ol { padding-left: 1.5em; margin: 0.5em 0; }
#preview-pane li { margin: 0.2em 0; }
#preview-pane code { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); padding: 0.15em 0.4em; border-radius: 4px; }
#preview-pane pre { background: var(--accent-soft); padding: 1em; border-radius: var(--radius); overflow-x: auto; margin: 0.6em 0; }
#preview-pane pre code { background: none; padding: 0; }
#preview-pane blockquote { border-left: 3px solid var(--border); padding-left: 1em; color: var(--text-2); margin: 0.6em 0; }
#preview-pane a { color: var(--green); text-decoration: underline; }
#preview-pane hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
#preview-pane table { border-collapse: collapse; width: 100%; margin: 0.6em 0; }
#preview-pane th, #preview-pane td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
#preview-pane th { background: var(--accent-soft); font-weight: 500; }
#preview-pane strong { font-weight: 500; }
#preview-pane em { font-style: italic; }

/* Dialog */
#dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
#dialog-overlay.visible { display: flex; }
#dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; max-width: 360px; width: 90%; }
#dialog h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
#dialog p { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 20px; }
.dialog-btns { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-btns button { padding: 7px 16px; border-radius: var(--radius); font-size: 13px; font-family: var(--font-sans); cursor: pointer; border: 1px solid var(--border); background: none; color: var(--text); transition: all 0.15s; }
.dialog-btns button.primary { background: var(--red); color: #fff; border-color: var(--red); }
.dialog-btns button:hover { opacity: 0.85; }

/* Tabs */
#tab-bar { display: flex; padding: 0 14px; border-bottom: 1px solid var(--border-soft); gap: 2px; }
.tab { padding: 8px 12px; font-size: 12px; font-family: var(--font-mono); color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: var(--text-2); }
.tab.active { color: var(--text); border-bottom-color: var(--text); }

/* Mobile */
@media (max-width: 600px) {
  #sidebar { width: 100vw; min-width: 100vw; height: 100%; border-right: none; display: none; }
  #sidebar.mob-visible { display: flex; }
  #mob-back { display: flex !important; }
}
#mob-back { display: none; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--text-2); font-size: 13px; font-family: var(--font-sans); padding: 5px 0; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar" class="mob-visible">
    <div id="sidebar-top">
      <h1 id="sidebar-label">Memo</h1>
      <div class="top-btns">
        <button class="icon-btn" onclick="toggleTrash()" title="ゴミ箱" id="trash-btn">🗑</button>
        <button class="icon-btn" onclick="newNote()" title="新しいメモ" id="new-btn">+</button>
      </div>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="検索…" oninput="filterNotes(this.value)" />
    </div>
    <div id="conn-status"><span class="dot"></span><span id="conn-text">接続確認中…</span></div>
    <div id="notes-list"></div>
  </div>

  <div id="main">
    <div id="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span>メモを選択するか、新しいメモを作成</span>
    </div>

    <div id="editor">
      <div id="editor-bar">
        <button id="mob-back" onclick="showSidebar()">← 一覧</button>
        <input id="title-input" type="text" placeholder="タイトル…" oninput="scheduleSave()" />
        <span id="save-status"></span>
        <div class="bar-btns">
          <button class="bar-btn active" id="edit-tab" onclick="setMode('edit')">編集</button>
          <button class="bar-btn" id="preview-tab" onclick="setMode('preview')">プレビュー</button>
          <button class="bar-btn" id="split-tab" onclick="setMode('split')">分割</button>
          <button class="bar-btn danger" id="del-btn" onclick="confirmDelete()">削除</button>
          <button class="bar-btn restore-btn" id="restore-btn" onclick="restoreNote()" style="display:none">復元</button>
        </div>
      </div>
      <div id="editor-body">
        <textarea id="content-input" placeholder="ここにメモを書いてください…&#10;&#10;マークダウン記法が使えます：&#10;# 見出し1&#10;## 見出し2&#10;**太字** / *斜体*&#10;- リスト項目&#10;`コード`" oninput="scheduleSave(); updatePreview()"></textarea>
        <div id="preview-pane"></div>
      </div>
    </div>
  </div>
</div>

<!-- 削除確認ダイアログ -->
<div id="dialog-overlay">
  <div id="dialog">
    <h3>メモを削除しますか？</h3>
    <p>このメモはゴミ箱に移動されます。ゴミ箱内のメモは30日後に自動的に完全削除されます。</p>
    <div class="dialog-btns">
      <button onclick="closeDialog()">キャンセル</button>
      <button class="primary" onclick="deleteNote()">ゴミ箱へ移動</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nxikzklntxagosklypbq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54aWt6a2xudHhhZ29za2x5cGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Nzk2NzksImV4cCI6MjA5NjQ1NTY3OX0.7n0UCkqM1CFaN14m7qu9ig4kcO9kPQBuIe302toQ5R0';
const H = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

let notes = [];
let trashNotes = [];
let currentId = null;
let saveTimer = null;
let searchQuery = '';
let ws = null;
let viewMode = 'notes'; // 'notes' | 'trash'
let editMode = 'edit'; // 'edit' | 'preview' | 'split'
let isTrashNote = false;

async function req(method, path, body) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

async function loadNotes() {
  try {
    const data = await req('GET', 'notes?order=updated_at.desc&select=id,title,content,updated_at');
    notes = data || [];
    renderList();
    setConn(true);
    startRealtime();
  } catch(e) { setConn(false); }
}

async function loadTrash() {
  try {
    const data = await req('GET', 'trash?order=deleted_at.desc&select=id,title,content,deleted_at,original_id');
    trashNotes = data || [];
    renderList();
  } catch(e) { console.error(e); }
}

function setConn(ok) {
  const el = document.getElementById('conn-status');
  document.getElementById('conn-text').textContent = ok ? '接続済み' : '接続エラー';
  el.className = ok ? 'ok' : 'err';
}

function startRealtime() {
  const url = SUPABASE_URL.replace('https','wss') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ topic: 'realtime:public:notes', event: 'phx_join', payload: {}, ref: '1' }));
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (['INSERT','UPDATE','DELETE'].includes(m.event)) loadNotes(); };
  ws.onclose = () => setTimeout(startRealtime, 3000);
}

function toggleTrash() {
  viewMode = viewMode === 'notes' ? 'trash' : 'notes';
  currentId = null;
  document.getElementById('editor').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('sidebar-label').textContent = viewMode === 'trash' ? 'ゴミ箱' : 'Memo';
  document.getElementById('new-btn').style.display = viewMode === 'trash' ? 'none' : 'flex';
  document.getElementById('trash-btn').style.background = viewMode === 'trash' ? 'var(--text)' : '';
  document.getElementById('trash-btn').style.color = viewMode === 'trash' ? 'var(--bg)' : '';
  searchQuery = '';
  document.getElementById('search').value = '';
  if (viewMode === 'trash') loadTrash(); else renderList();
}

function renderList() {
  const el = document.getElementById('notes-list');
  const q = searchQuery.toLowerCase();
  const list = viewMode === 'trash' ? trashNotes : notes;
  const filtered = list.filter(n => !q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q));
  if (!filtered.length) { el.innerHTML = '<div class="empty-list">' + (viewMode==='trash'?'ゴミ箱は空です':'メモなし') + '</div>'; return; }
  el.innerHTML = filtered.map(n => `
    <div class="note-item${n.id===currentId?' active':''} ${viewMode==='trash'?'trash-item':''}" data-id="${n.id}">
      <div class="ni-title">${esc(n.title||'無題のメモ')}</div>
      <div class="ni-preview">${esc((n.content||'').slice(0,70))}</div>
      <div class="ni-date">${viewMode==='trash'?'削除: '+relTime(n.deleted_at):relTime(n.updated_at)}</div>
    </div>`).join('');
  el.querySelectorAll('.note-item').forEach(item => {
    item.addEventListener('click', () => selectNote(item.dataset.id));
  });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000) return 'たった今';
  if (diff < 3600000) return Math.floor(diff/60000)+'分前';
  if (diff < 86400000) return Math.floor(diff/3600000)+'時間前';
  return d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
}

function selectNote(id) {
  currentId = id;
  isTrashNote = viewMode === 'trash';
  const list = isTrashNote ? trashNotes : notes;
  const note = list.find(n => n.id === id);
  if (!note) return;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('editor').style.display = 'flex';
  document.getElementById('title-input').value = note.title || '';
  document.getElementById('title-input').disabled = isTrashNote;
  document.getElementById('content-input').disabled = isTrashNote;
  document.getElementById('del-btn').style.display = isTrashNote ? 'none' : '';
  document.getElementById('restore-btn').style.display = isTrashNote ? '' : 'none';
  document.getElementById('content-input').value = note.content || '';
  updatePreview();
  setStatus('');
  renderList();
  if (window.innerWidth <= 600) document.getElementById('sidebar').classList.remove('mob-visible');
}

function showSidebar() {
  document.getElementById('sidebar').classList.add('mob-visible');
  currentId = null;
  document.getElementById('editor').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  renderList();
}

async function newNote() {
  try {
    const data = await req('POST', 'notes', { title: '', content: '', updated_at: new Date().toISOString() });
    const note = Array.isArray(data) ? data[0] : data;
    notes.unshift(note);
    renderList();
    selectNote(note.id);
    document.getElementById('title-input').focus();
  } catch(e) { setStatus('エラー', true); }
}

function scheduleSave() {
  if (isTrashNote) return;
  setStatus('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNote, 800);
}

async function saveNote() {
  if (!currentId || isTrashNote) return;
  const title = document.getElementById('title-input').value;
  const content = document.getElementById('content-input').value;
  try {
    setStatus('保存中');
    await req('PATCH', `notes?id=eq.${currentId}`, { title, content, updated_at: new Date().toISOString() });
    const i = notes.findIndex(n => n.id === currentId);
    if (i >= 0) { notes[i].title = title; notes[i].content = content; notes[i].updated_at = new Date().toISOString(); }
    notes.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderList();
    setStatus('保存済み ✓', false, true);
    setTimeout(() => setStatus(''), 2500);
  } catch(e) { setStatus('保存エラー', true); }
}

function confirmDelete() {
  if (!currentId) return;
  document.getElementById('dialog-overlay').classList.add('visible');
}
function closeDialog() {
  document.getElementById('dialog-overlay').classList.remove('visible');
}

async function deleteNote() {
  closeDialog();
  if (!currentId) return;
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  try {
    await req('POST', 'trash', { title: note.title, content: note.content, deleted_at: new Date().toISOString(), original_id: note.id });
    await req('DELETE', `notes?id=eq.${currentId}`);
    notes = notes.filter(n => n.id !== currentId);
    currentId = null;
    document.getElementById('editor').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    renderList();
  } catch(e) { setStatus('削除エラー', true); }
}

async function restoreNote() {
  if (!currentId) return;
  const note = trashNotes.find(n => n.id === currentId);
  if (!note) return;
  try {
    await req('POST', 'notes', { title: note.title, content: note.content, updated_at: new Date().toISOString() });
    await req('DELETE', `trash?id=eq.${currentId}`);
    trashNotes = trashNotes.filter(n => n.id !== currentId);
    currentId = null;
    document.getElementById('editor').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    renderList();
    alert('メモを復元しました！');
  } catch(e) { alert('復元エラー: ' + e.message); }
}

function filterNotes(q) { searchQuery = q; renderList(); }

function setStatus(msg, isErr, isOk) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = isErr ? 'error' : isOk ? 'saved' : '';
}

// Markdown
function setMode(mode) {
  editMode = mode;
  const inp = document.getElementById('content-input');
  const prev = document.getElementById('preview-pane');
  document.getElementById('edit-tab').className = 'bar-btn' + (mode==='edit'?' active':'');
  document.getElementById('preview-tab').className = 'bar-btn' + (mode==='preview'?' active':'');
  document.getElementById('split-tab').className = 'bar-btn' + (mode==='split'?' active':'');
  inp.style.display = (mode==='preview') ? 'none' : 'block';
  inp.style.flex = mode==='split' ? '1' : '';
  prev.style.display = (mode==='edit') ? 'none' : 'block';
  prev.style.flex = mode==='split' ? '1' : '';
  if (mode==='split') { prev.style.borderLeft = '1px solid var(--border)'; } else { prev.style.borderLeft = ''; }
  if (mode !== 'edit') updatePreview();
}

function updatePreview() {
  if (editMode === 'edit') return;
  const content = document.getElementById('content-input').value;
  document.getElementById('preview-pane').innerHTML = marked.parse(content || '');
}

// ESCキーでダイアログを閉じる
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
document.getElementById('dialog-overlay').addEventListener('click', e => { if (e.target === document.getElementById('dialog-overlay')) closeDialog(); });

loadNotes();
</script>
</body>
</html>
