    })
    .subscribe();
}

/* ── Sort mode ── */
function setSortMode(mode, persist = true) {
  sortMode = mode;
  document.getElementById('sort-manual').className = mode === 'manual' ? 'sortbtn active' : 'sortbtn';
  document.getElementById('sort-auto').className    = mode === 'auto'   ? 'sortbtn active' : 'sortbtn';
  renderGrid();
  if (persist) saveSettings({ note_sort_mode: mode });
}

/* ── Tag filter (uses the "theme" data field) ── */
let tagSortMode = 'alpha';
let tagOrder = [];
let tagDragId = null;

function setTagSortMode(mode, persist = true) {
  tagSortMode = mode;
  document.getElementById('tag-sort-alpha').className  = mode === 'alpha'  ? 'tinybtn active' : 'tinybtn';
  document.getElementById('tag-sort-manual').className = mode === 'manual' ? 'tinybtn active' : 'tinybtn';
  const mb = document.getElementById('mob-tag-sort-btn');
  if (mb) { mb.textContent = mode === 'alpha' ? 'abc' : '↕'; mb.className = 'tinybtn' + (mode === 'manual' ? ' active' : ''); }
  renderThemes();
  if (persist) saveSettings({ tag_sort_mode: mode });
}
function cycleTagSortMode() { setTagSortMode(tagSortMode === 'alpha' ? 'manual' : 'alpha'); }

function renderThemes() {
  const all = new Set();
  notes.forEach(n => (n.theme || []).forEach(t => all.add(t)));
  const containers = [document.getElementById('theme-list'), document.getElementById('mob-theme-list')];

  let ordered;
  if (tagSortMode === 'alpha') {
    ordered = [...all].sort();
  } else {
    // manual: stored order first, then any new tags not yet placed
    ordered = tagOrder.filter(t => all.has(t)).concat([...all].filter(t => !tagOrder.includes(t)));
    if (JSON.stringify(ordered) !== JSON.stringify(tagOrder)) {
      tagOrder = ordered;
      saveSettings({ tag_order: tagOrder });
    }
  }

  containers.forEach(el => {
    if (!el) return;
    el.innerHTML = '';
    if (!all.size) { el.innerHTML = '<span style="font-size:11px;color:var(--text3);padding:2px 4px;">まだタグがありません</span>'; return; }
    ordered.forEach(t => el.appendChild(buildTagChip(t)));
  });
}

/* Tag chips still use the browser's native HTML5 drag-and-drop (desktop only)
   for manual reordering — unlike note cards, which needed the custom pointer
   system in "Drag to reorder" below to support touch. This is a simpler,
   lower-stakes reorder (no server round trip, just a locally-stored order),
   so it hasn't been worth rebuilding on the same touch-friendly system. */
function buildTagChip(t) {
  const chip = document.createElement('div');
  chip.className = 'theme-chip' + (activeTheme === t ? ' active' : '');
  chip.textContent = t;
  chip.onclick = () => {
    activeTheme = activeTheme === t ? null : t;
    renderThemes();
    renderGrid();
  };
  if (tagSortMode === 'manual') {
    chip.draggable = true;
    chip.addEventListener('dragstart', () => { tagDragId = t; chip.classList.add('dragging'); });
    chip.addEventListener('dragend',   () => { chip.classList.remove('dragging'); document.querySelectorAll('.theme-chip.drop-target').forEach(c=>c.classList.remove('drop-target')); });
    chip.addEventListener('dragover',  e => { e.preventDefault(); chip.classList.add('drop-target'); });
    chip.addEventListener('dragleave', () => { chip.classList.remove('drop-target'); });
    chip.addEventListener('drop', e => {
      e.preventDefault(); chip.classList.remove('drop-target');
      if (tagDragId && tagDragId !== t) {
        const from = tagOrder.indexOf(tagDragId), to = tagOrder.indexOf(t);
        if (from >= 0 && to >= 0) {
          tagOrder.splice(to, 0, tagOrder.splice(from, 1)[0]);
          saveSettings({ tag_order: tagOrder });
          renderThemes();
        }
      }
      tagDragId = null;
    });
  }
  return chip;
}

/* ── Folders ──
   Unlike tags (many-per-note, stored on the note itself), a folder is one-per-note
   and lives in its own table so it can have its own name/order/identity. Desktop
   gets full management (rename/reorder/delete) in the sidebar; mobile gets
   select-to-filter and drag-to-assign only, via simpler chips — the same scope
   split already used for tag manual-reordering (PC-only), for the same reason:
   these are fiddlier interactions that don't translate well to a small touch screen. */
async function refreshFolders() {
  try {
    const { data, error } = await sb.from('folders').select('*').order('sort_order', { ascending: true });
    if (error) throw error;
    folders = data || [];
    renderFolders();
  } catch(e) { console.error('load folders failed', e); }
}

let foldersRealtimeWired = false;
function wireFoldersRealtime() {
  if (foldersRealtimeWired) return;
  foldersRealtimeWired = true;
  sb.channel('folders-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'folders' }, () => refreshFolders())
    .subscribe();
}

function selectFolder(id) {
  activeFolder = (id === FOLDER_ALL) ? FOLDER_ALL : (activeFolder === id ? FOLDER_ALL : id);
  renderFolders();
  renderGrid();
}

function renderFolders() {
  const sorted = [...folders].sort((a,b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));

  const desktop = document.getElementById('folder-list');
  desktop.innerHTML = '';
  desktop.appendChild(buildFolderRow({ id: FOLDER_ALL, name: 'すべて' }, true));
  desktop.appendChild(buildFolderRow({ id: FOLDER_UNFILED, name: '未分類' }, true));
  sorted.forEach((f, i) => desktop.appendChild(buildFolderRow(f, false, i === 0, i === sorted.length - 1)));

  const mobile = document.getElementById('mob-folder-list');
  mobile.innerHTML = '';
  mobile.appendChild(buildFolderChip({ id: FOLDER_ALL, name: 'すべて' }));
  mobile.appendChild(buildFolderChip({ id: FOLDER_UNFILED, name: '未分類' }));
  sorted.forEach(f => mobile.appendChild(buildFolderChip(f)));

  if (currentId && !inTrash) {
    const n = notes.find(x => x.id === currentId);
    if (n) renderFolderSelect(n.folder_id || null);
  }
}

/* Folder picker inside the editor — lets you file the open note without
   having to drag its card in the grid. */
function renderFolderSelect(currentFolderId) {
  const sel = document.getElementById('e-folder-select');
  sel.innerHTML = '';
  const unfiled = document.createElement('option');
  unfiled.value = '';
  unfiled.textContent = '未分類';
  sel.appendChild(unfiled);
  [...folders].sort((a,b) => (a.sort_order ?? 0) - (b.sort_order ?? 0)).forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = f.name;
    sel.appendChild(opt);
  });
  sel.value = currentFolderId || '';
}

function onFolderSelectChange() {
  if (!currentId || inTrash) return;
  const value = document.getElementById('e-folder-select').value || null;
  assignToFolder(currentId, value);
}

/* A folder row is a valid drop target for assigning a dragged note (see
   updateDropTarget) whenever it has a real or pseudo folder id — "すべて"
   deliberately has no dataset.folderId so it can't be dropped on. */
function buildFolderRow(folder, isPseudo, isFirst, isLast) {
  const row = document.createElement('div');
  row.className = 'folder-row' + (activeFolder === folder.id ? ' active' : '');
  if (folder.id !== FOLDER_ALL) {
    row.classList.add('folder-drop-zone');
    row.dataset.folderId = folder.id === FOLDER_UNFILED ? '' : folder.id;
  }

  const nameEl = document.createElement('span');
  nameEl.className = 'folder-name';
  nameEl.textContent = folder.name;
  nameEl.onclick = () => selectFolder(folder.id);
  row.appendChild(nameEl);

  if (!isPseudo) {
    const actions = document.createElement('div');
    actions.className = 'folder-actions';

    const up = document.createElement('button');
    up.type = 'button'; up.textContent = '▲'; up.title = '上へ'; up.disabled = isFirst;
    up.onclick = e => { e.stopPropagation(); moveFolder(folder, -1); };

    const down = document.createElement('button');
    down.type = 'button'; down.textContent = '▼'; down.title = '下へ'; down.disabled = isLast;
    down.onclick = e => { e.stopPropagation(); moveFolder(folder, 1); };

    const rename = document.createElement('button');
    rename.type = 'button'; rename.textContent = '✎'; rename.title = '名前を変更';
    rename.onclick = e => { e.stopPropagation(); startRenameFolder(folder, nameEl); };

    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '×'; del.title = '削除';
    del.onclick = e => { e.stopPropagation(); deleteFolder(folder, del); };

    actions.append(up, down, rename, del);
    row.appendChild(actions);
  }
  return row;
}

function buildFolderChip(folder) {
  const chip = document.createElement('div');
  chip.className = 'folder-chip' + (activeFolder === folder.id ? ' active' : '');
  chip.textContent = folder.name;
  if (folder.id !== FOLDER_ALL) {
    chip.classList.add('folder-drop-zone');
    chip.dataset.folderId = folder.id === FOLDER_UNFILED ? '' : folder.id;
  }
  chip.onclick = () => selectFolder(folder.id);
  return chip;
}

function startRenameFolder(folder, nameEl) {
  const input = document.createElement('input');
  input.className = 'folder-rename-input';
  input.value = folder.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  let committed = false;
  const commit = async () => {
    if (committed) return;
    committed = true;
    const newName = input.value.trim() || folder.name;
    if (newName !== folder.name) {
      folder.name = newName;
      try { await sb.from('folders').update({ name: newName }).eq('id', folder.id); }
      catch(e) { console.error('rename folder failed', e); }
    }
    renderFolders();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { committed = true; renderFolders(); }
  });
}

async function moveFolder(folder, direction) {
  const sorted = [...folders].sort((a,b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  const i = sorted.findIndex(f => f.id === folder.id);
  const j = i + direction;
  if (i < 0 || j < 0 || j >= sorted.length) return;
  [sorted[i].sort_order, sorted[j].sort_order] = [sorted[j].sort_order, sorted[i].sort_order];
  renderFolders();
  try {
    await Promise.all([
      sb.from('folders').update({ sort_order: sorted[i].sort_order }).eq('id', sorted[i].id),
      sb.from('folders').update({ sort_order: sorted[j].sort_order }).eq('id', sorted[j].id)
    ]);
  } catch(e) { console.error('reorder folders failed', e); }
}

let folderDeleteArmed = null;
async function deleteFolder(folder, btn) {
  if (folderDeleteArmed !== folder.id) {
    folderDeleteArmed = folder.id;
    btn.textContent = '確認';
    btn.classList.add('confirm-del');
    setTimeout(() => { if (folderDeleteArmed === folder.id) { folderDeleteArmed = null; renderFolders(); } }, 3000);
    return;
  }
  folderDeleteArmed = null;
  folders = folders.filter(f => f.id !== folder.id);
  if (activeFolder === folder.id) activeFolder = FOLDER_ALL;
  notes.forEach(n => { if (n.folder_id === folder.id) n.folder_id = null; }); // DB does the same via ON DELETE SET NULL
  renderFolders();
  renderGrid();
  try { await sb.from('folders').delete().eq('id', folder.id); }
  catch(e) { console.error('delete folder failed', e); }
}

function onFolderAddKeydown(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('folder-add-input');
  createFolder(input.value);
  input.value = '';
}

async function createFolder(name) {
  name = name.trim();
  if (!name || !uid) return;
  const maxOrder = folders.reduce((m,f) => Math.max(m, f.sort_order ?? 0), 0);
  try {
    const { data, error } = await sb.from('folders').insert({ user_id: uid, name, sort_order: maxOrder + 1 }).select().single();
    if (error) throw error;
    folders.push(data);
    renderFolders();
  } catch(e) { console.error('create folder failed', e); }
}

/* Drag a note onto a folder row/chip to file it there (see updateDropTarget /
   finishDrag in the drag-to-reorder section, which detect this case). */
async function assignToFolder(id, folderId) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  const siblings = notes.filter(x => x.id !== id && (x.folder_id || null) === (folderId || null) && !!x.pinned === !!n.pinned);
  n.folder_id = folderId;
  n.sort_order = siblings.length ? Math.max(...siblings.map(x => x.sort_order ?? 0)) + 1 : 0;
  renderGrid();
  try { await sb.from('notes').update({ folder_id: folderId, sort_order: n.sort_order }).eq('id', id); }
  catch(e) { console.error('folder assign error', e); }
}

/* ── View mode (card grid / list) ── */
function toggleView() {
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  const icon = viewMode === 'grid' ? '▦' : '☰';
  const title = viewMode === 'grid' ? 'リスト表示に切替' : 'カード表示に切替';
  document.getElementById('view-btn').textContent = icon;
  document.getElementById('view-btn').title = title;
  const mb = document.getElementById('mob-view-btn');
  if (mb) { mb.textContent = icon; mb.title = title; }
  renderGrid();
}

/* ── Grid ── */
function getFiltered() {
  let list = inTrash ? trashList : notes.slice();
  const q = query.toLowerCase();
  list = list.filter(n =>
    (!q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q)) &&
    (!activeTheme || inTrash || (n.theme||[]).includes(activeTheme)) &&
    (activeFolder === FOLDER_ALL || inTrash || (activeFolder === FOLDER_UNFILED ? !n.folder_id : n.folder_id === activeFolder))
  );
  return list;
}

/* Manual drag-reordering is a PC-only feature (mobile keeps things simple:
   always sorted by update time). This checks the layout live, so it stays
   correct even if a desktop session's "manual" preference has synced in. */
function isMobileLayout() {
  return window.matchMedia('(max-width: 640px)').matches;
}

function sortGroup(list) {
  const mode = isMobileLayout() ? 'auto' : sortMode;
  if (mode === 'manual') return list.sort((a,b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  return list.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
}

function getSorted() {
  // Trash has no pinning — one flat list, newest deleted first.
  if (inTrash) return getFiltered().sort((a,b) => new Date(b.deleted_at) - new Date(a.deleted_at));
  return sortGroup(getFiltered());
}

function renderGrid() {
  updateSynthButtonState();
  const el = document.getElementById('grid');
  el.classList.toggle('list-mode', viewMode === 'list');
  el.innerHTML = '';

  if (inTrash) {
    const show = getSorted();
    if (!show.length) { el.innerHTML = '<div class="empty-msg">ゴミ箱は空です</div>'; return; }
    const wrap = document.createElement('div');
    wrap.className = viewMode === 'list' ? '' : 'group-grid';
    fillItems(wrap, show, false);
    el.appendChild(wrap);
    return;
  }

  const filtered = getFiltered();
  const pinned   = sortGroup(filtered.filter(n => n.pinned));
  const unpinned = sortGroup(filtered.filter(n => !n.pinned));

  el.appendChild(buildGroup('📌 ピン留め', pinned, true));
  el.appendChild(buildGroup(null, unpinned, false));
}

function buildGroup(label, items, isPinnedGroup) {
  const section = document.createElement('div');
  section.className = 'group-section';

  if (label) {
    const h = document.createElement('div');
    h.className = 'group-label';
    h.textContent = label;
    section.appendChild(h);
  }

  const wrap = document.createElement('div');
  wrap.className = viewMode === 'list' ? 'group-list' : 'group-grid';
  wrap.dataset.pinnedGroup = isPinnedGroup ? '1' : '0';
  if (!items.length && isPinnedGroup) {
    wrap.classList.add('group-empty');
    wrap.innerHTML = '<div class="empty-hint">メモをここへドラッグするとピン留めされます</div>';
  }
  fillItems(wrap, items, isPinnedGroup);

  section.appendChild(wrap);
  return section;
}

function fillItems(wrap, items, isPinnedGroup) {
  items.forEach(n => {
    const item = viewMode === 'list' ? buildRow(n) : buildCard(n);
    wireDrag(item, n);
    wrap.appendChild(item);
  });
}

/* What buildCard/buildRow actually differ on is the DOM layout; everything
   about "which content to show" and "how items behave" is shared here. */
function displayFieldsFor(n) {
  const pending = !inTrash ? loadPendingDraft(n.id) : null;
  return {
    pending,
    title: pending ? pending.title : n.title,
    content: pending ? pending.content : n.content,
    theme: pending ? (pending.theme || []) : (n.theme || [])
  };
}
function tagsHtml(theme, max) {
  return theme.slice(0, max).map(t => '<span class="tag-chip">' + esc(t) + '</span>').join('');
}
function pinButtonHtml(n) {
  return inTrash ? '' : '<button type="button" class="pin-btn' + (n.pinned ? ' active' : '') + '" title="ピン留め切替">📌</button>';
}
function wireItemBehavior(item, n) {
  item.addEventListener('click', () => { if (dragMoved) { dragMoved = false; return; } openNote(n.id); });
  if (!inTrash) item.querySelector('.pin-btn').addEventListener('click', e => { e.stopPropagation(); togglePin(n.id); });
}

function buildCard(n) {
  const { pending, title, content, theme } = displayFieldsFor(n);
  const card = document.createElement('div');
  card.className = 'card' + (inTrash ? ' trashed' : '');
  card.dataset.id = n.id;
  card.innerHTML =
    pinButtonHtml(n) +
    (pending ? '<span class="pending-dot" title="未送信の変更があります"></span>' : '') +
    '<div class="card-title">' + esc(title || '無題のメモ') + '</div>' +
    '<div class="card-body">' + esc((content || '').replace(/[#*`>]/g,'')) + '</div>' +
    '<div class="card-footer"><div class="card-tags">' + tagsHtml(theme, 3) + '</div>' +
    '<div class="card-date">' + (inTrash ? rel(n.deleted_at) : rel(n.updated_at)) + '</div></div>';
  wireItemBehavior(card, n);
  return card;
}

function buildRow(n) {
  const { pending, title, content, theme } = displayFieldsFor(n);
  const row = document.createElement('div');
  row.className = 'row' + (inTrash ? ' trashed' : '');
  row.dataset.id = n.id;
  row.innerHTML =
    pinButtonHtml(n) +
    (pending ? '<span class="pending-dot" title="未送信の変更があります"></span>' : '') +
    '<div class="row-title">' + esc(title || '無題のメモ') + '</div>' +
    '<div class="row-body">' + esc((content || '').replace(/[#*`>]/g,'')) + '</div>' +
    '<div class="row-tags">' + tagsHtml(theme, 2) + '</div>' +
    '<div class="row-date">' + (inTrash ? rel(n.deleted_at) : rel(n.updated_at)) + '</div>';
  wireItemBehavior(row, n);
  return row;
}

async function togglePin(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.pinned = !n.pinned;
  renderGrid();
  try { await sb.from('notes').update({ pinned: n.pinned }).eq('id', id); }
  catch(e) { console.error('pin toggle error', e); }
}

/* ── Drag to reorder (mouse: press+move; touch: long-press+move) ──
   Native HTML5 drag-and-drop doesn't work reliably for touch on iOS Safari
   (a press-and-hold there is captured as text selection instead), so this
   builds its own drag using Pointer Events, which covers mouse and touch
   with one code path and lets us show a clear before/after insertion line. */
let ptrDrag = null; // { id, sourceItem }

function wireDrag(item, n) {
  if (inTrash) return;
  if (!isMobileLayout() && sortMode !== 'manual') return; // desktop: reordering only in manual mode
  item.classList.add('drag-enabled');
  item.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin-btn')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.pointerType !== 'touch') e.preventDefault(); // stops native text-select/drag-ghost on mouse
    armDrag(e, item, n);
  });
}

function lockScroll(lock) {
  const el = document.getElementById('grid-wrap');
  el.style.overflowY = lock ? 'hidden' : '';
}

function armDrag(downEvent, item, n) {
  const startX = downEvent.clientX, startY = downEvent.clientY;
  const isTouch = downEvent.pointerType === 'touch';
  let longPressTimer = null;
  let armed = false;   // true once drag officially begins
  let cancelled = false;

  const beginDrag = () => {
    if (cancelled || armed) return;
    armed = true;
    dragMoved = true;
    ptrDrag = { id: n.id, sourceItem: item };
    item.classList.add('dragging');
    lockScroll(true); // stop the list from scrolling under the finger while dragging
    if (navigator.vibrate) navigator.vibrate(8);
  };

  const onMove = me => {
    if (armed) {
      if (me.cancelable) me.preventDefault();
      updateDropTarget(me.clientX, me.clientY, item);
      return;
    }
    if (!isTouch) {
      // Mouse: start dragging as soon as it moves a few pixels — no long-press needed.
      if (Math.abs(me.clientX - startX) > 4 || Math.abs(me.clientY - startY) > 4) beginDrag();
    } else if (Math.abs(me.clientX - startX) > 8 || Math.abs(me.clientY - startY) > 8) {
      // Touch: moved before the long-press fired — this is a scroll/tap, not a drag.
      cancelled = true;
      clearTimeout(longPressTimer);
    }
  };

  const onUp = () => {
    clearTimeout(longPressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    lockScroll(false);
    if (armed) finishDrag();
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  if (isTouch) longPressTimer = setTimeout(beginDrag, 400);
}

function clearDropVisuals() {
  document.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  document.querySelectorAll('.folder-drop-hover').forEach(el => el.classList.remove('folder-drop-hover'));
}

function nextDragItem(item) {
  let sib = item.nextElementSibling;
  while (sib && !(sib.classList.contains('card') || sib.classList.contains('row'))) sib = sib.nextElementSibling;
  return sib;
}

function prevDragItem(item) {
  let sib = item.previousElementSibling;
  while (sib && !(sib.classList.contains('card') || sib.classList.contains('row'))) sib = sib.previousElementSibling;
  return sib;
}

function updateDropTarget(x, y, sourceItem) {
  clearDropVisuals();
  const el = document.elementFromPoint(x, y);

  // Dropping onto a folder row/chip files the note there instead of reordering it.
  const folderEl = el && el.closest('.folder-drop-zone');
  if (folderEl) {
    folderEl.classList.add('folder-drop-hover');
    ptrDrag.target = { folderId: folderEl.dataset.folderId || null };
    return;
  }

  // Mobile has no manual reordering — dragging there is only for filing into a folder.
  if (isMobileLayout()) { ptrDrag.target = null; return; }

  const item = el && el.closest('.card,.row');

  if (item && item !== sourceItem) {
    const rect = item.getBoundingClientRect();
    const horizontal = viewMode !== 'list';
    const side = horizontal
      ? ((x - rect.left) > rect.width / 2 ? 'after' : 'before')
      : ((y - rect.top)  > rect.height / 2 ? 'after' : 'before');
    ptrDrag.target = { id: item.dataset.id, side, pinnedGroup: item.closest('.group-grid,.group-list').dataset.pinnedGroup === '1' };

    // Highlight both sides of the gap the note will drop into: the trailing
    // edge of the item before the gap, and the leading edge of the item after it.
    const leadItem  = side === 'before' ? item : nextDragItem(item);
    const trailItem = side === 'before' ? prevDragItem(item) : item;
    if (leadItem  && leadItem  !== sourceItem) leadItem.classList.add('drop-after');
    if (trailItem && trailItem !== sourceItem) trailItem.classList.add('drop-before');
    return;
  }

  // Not over an item — check whether we're over a group's empty space (append to end)
  const group = el && el.closest('.group-grid,.group-list');
  ptrDrag.target = group ? { id: null, side: null, pinnedGroup: group.dataset.pinnedGroup === '1' } : null;
}

function finishDrag() {
  clearDropVisuals();
  ptrDrag.sourceItem.classList.remove('dragging');
  const t = ptrDrag.target;
  if (t && 'folderId' in t) assignToFolder(ptrDrag.id, t.folderId || null);
  else if (t) reorder(ptrDrag.id, t.id, t.pinnedGroup, t.side === 'after');
  ptrDrag = null;
  setTimeout(() => { dragMoved = false; }, 30); // swallow the synthetic click that follows a drag
}

async function reorder(draggedId, targetId, targetPinned, insertAfter) {
  const dragged = notes.find(n => n.id === draggedId);
  if (!dragged) return;

  // Build the destination group's current order (excluding the dragged note itself)
  const group = sortGroup(getFiltered().filter(n => !!n.pinned === !!targetPinned && n.id !== draggedId));

  dragged.pinned = !!targetPinned;

  if (targetId) {
    let to = group.findIndex(n => n.id === targetId);
    if (to < 0) to = group.length;
    else if (insertAfter) to += 1;
    group.splice(to, 0, dragged);
  } else {
    group.push(dragged); // dropped on empty space -> append to end
  }

  group.forEach((n, i) => { n.sort_order = i; });
  renderGrid();
  try {
    await Promise.all(group.map(n => sb.from('notes').update({ sort_order: n.sort_order, pinned: n.pinned }).eq('id', n.id)));
  } catch(e) { console.error('reorder save error', e); }
}

function syncMobTitle() { document.getElementById('mob-title').textContent = document.getElementById('s-label').textContent; }

/* ── Open note / editor ── */
let currentTags = [];
let editBaseUpdatedAt = null;

function openNote(id) {
  flushPendingSave();
  const list = inTrash ? trashList : notes;
  const note = list.find(n => n.id === id);
  if (!note) return;

  const pending = !inTrash ? loadPendingDraft(id) : null;

  currentId = id;
  editBaseUpdatedAt = pending ? pending.baseUpdatedAt : note.updated_at;
  document.getElementById('editor').classList.add('open');
  document.getElementById('e-title').value = pending ? pending.title : (note.title || '');
  document.getElementById('e-input').value = pending ? pending.content : (note.content || '');
  document.getElementById('e-title').disabled = inTrash;
  document.getElementById('e-input').disabled = inTrash;
  document.getElementById('btn-del').style.display = inTrash ? 'none' : '';
  document.getElementById('btn-res').style.display = inTrash ? '' : 'none';
  document.getElementById('btn-preview').style.display = inTrash ? 'none' : '';

  currentTags = pending ? [...(pending.theme || [])] : [...(note.theme || [])];
  document.getElementById('e-tag-input').value = '';
  document.getElementById('e-tag-input').disabled = inTrash;
  document.getElementById('e-tag-input-wrap').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('e-tag-suggest').style.display = 'none';
  renderTagChips();

  document.getElementById('e-folder-row').style.display = inTrash ? 'none' : 'flex';
  renderFolderSelect(note.folder_id || null);

  updatePreview();
  setStatus(pending ? '未送信の変更があります' : '');
}
function closeEditor() {
  flushPendingSave();
  document.getElementById('editor').classList.remove('open');
  currentId = null;
}

function togglePreview() {
  showPreview = !showPreview;
  document.getElementById('btn-preview').className = showPreview ? 'ebtn active' : 'ebtn';
  document.getElementById('e-body').classList.toggle('preview-mode', showPreview);
  document.getElementById('e-preview').style.display = showPreview ? 'block' : 'none';
  updatePreview();
}
function updatePreview() {
  if (!showPreview) return;
  document.getElementById('e-preview').innerHTML = marked.parse(document.getElementById('e-input').value || '');
}

function onEdit() {
  if (inTrash || !currentId) return;
  setStatus('…');
  const localNote = notes.find(n => n.id === currentId);
  const type = (localNote && localNote.__pendingCreate) ? 'create' : 'update';
  savePendingDraft(currentId, draftFor(currentId, type, {
    title: document.getElementById('e-title').value,
    content: document.getElementById('e-input').value,
    theme: currentTags
  }));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 900);
}

/* ── Tag chips: pick from existing tags, or type a new one and press Enter ── */
function renderTagChips() {
  const el = document.getElementById('e-tags-chips');
  el.innerHTML = '';
  currentTags.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip removable';
    chip.textContent = t;
    if (!inTrash) {
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.textContent = '×';
      rm.setAttribute('aria-label', 'タグを削除');
      rm.onclick = () => removeTag(t);
      chip.appendChild(rm);
    }
    el.appendChild(chip);
  });
}

function addTag(t) {
  t = t.trim();
  if (!t || currentTags.includes(t)) return;
  currentTags.push(t);
  renderTagChips();
  onEdit();
}

function removeTag(t) {
  currentTags = currentTags.filter(x => x !== t);
  renderTagChips();
  onEdit();
}

function allKnownTags() {
  const s = new Set();
  notes.forEach(n => (n.theme || []).forEach(t => s.add(t)));
  return [...s];
}

function onTagInput() {
  const val = document.getElementById('e-tag-input').value.trim().toLowerCase();
  const box = document.getElementById('e-tag-suggest');
  box.innerHTML = '';
  if (!val) { box.style.display = 'none'; return; }
  const matches = allKnownTags().filter(t => !currentTags.includes(t) && t.toLowerCase().includes(val)).slice(0, 6);
  if (!matches.length) { box.style.display = 'none'; return; }
  matches.forEach(t => {
    const item = document.createElement('div');
    item.className = 'tag-suggest-item';
    item.textContent = t;
    item.onclick = () => pickSuggestion(t);
    box.appendChild(item);
  });
  box.style.display = 'block';
}

function pickSuggestion(t) {
  addTag(t);
  const input = document.getElementById('e-tag-input');
  input.value = '';
  document.getElementById('e-tag-suggest').style.display = 'none';
  input.focus();
}

function onTagKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const input = document.getElementById('e-tag-input');
    addTag(input.value);
    input.value = '';
    document.getElementById('e-tag-suggest').style.display = 'none';
  } else if (e.key === 'Escape') {
    document.getElementById('e-tag-suggest').style.display = 'none';
  }
}

/* If there's a debounced save still pending for the note currently open,
   run it right now instead of leaving it on a timer. Without this, switching
   notes (or closing the editor) before the 900ms debounce fires means that
   timer still goes off later — by then `currentId` may point at a different
   note, or have been cleared, so the save either silently no-ops or (worse)
   saves stale form content under the wrong note's id. Call this before
   currentId changes, while it still refers to the note being left. */
function flushPendingSave() {
  if (saveTimer) {
    clearTimeout(saveTimer);
    saveTimer = null;
    save();
  }
}

/* Every save-like operation (interactive typing, and background flushing of
   offline/leftover drafts) is chained through here so at most one runs at a
   time. Without this, a background flush and active typing on the same note
   could interleave and read editBaseUpdatedAt before the other had updated
   it — each misreading the other's just-completed write as an external
   change and forking a spurious "conflict copy" even on one device, online. */
let saveChain = Promise.resolve();
function enqueueSave(fn) {
  saveChain = saveChain.then(fn, fn);
  return saveChain;
}
function save() {
  return enqueueSave(doSave);
}

async function doSave() {
  saveTimer = null;
  if (!currentId || inTrash) return;
  const title   = document.getElementById('e-title').value;
  const content = document.getElementById('e-input').value;
  const theme   = currentTags;
  const savingId = currentId;
  const localNote = notes.find(n => n.id === savingId);
  const isNew = !!(localNote && localNote.__pendingCreate);
  const baseUpdatedAt = editBaseUpdatedAt;
  try {
    const result = await attemptSyncNote(savingId, { title, content, theme }, {
      isNew, baseUpdatedAt,
      sort_order: localNote ? localNote.sort_order : 0,
      pinned: localNote ? !!localNote.pinned : false,
      folderId: localNote ? (localNote.folder_id || null) : null
    });
    clearPendingDraft(savingId); // successfully synced — the local draft is no longer needed

    if (result.mode === 'fork') {
      if (currentId === savingId) {
        currentId = result.copy.id;
        editBaseUpdatedAt = result.copy.updated_at;
        document.getElementById('e-title').value = result.copy.title;
      }
      renderThemes();
      renderGrid();
      setStatus('他の端末の変更と競合したためコピーを保存しました');
      setTimeout(() => setStatus(''), 4000);
      return;
    }

    if ((result.mode === 'update' || result.mode === 'created' || result.mode === 'noop') && currentId === savingId) editBaseUpdatedAt = result.updatedAt;
    renderThemes();
    renderGrid();
    setStatus('保存済み ✓', 'ok');
    setTimeout(() => setStatus(''), 2500);
  } catch(e) {
    // Offline or unreachable — the draft written in onEdit() stays in localStorage
    // and flushPendingEdits() will retry once the connection comes back. Still
    // re-render so this note's card picks up the "未送信" dot right away.
    setStatus('オフライン・未送信', 'err');
    renderGrid();
  }
}

async function newNote() {
  const id = crypto.randomUUID();
  const minOrder = notes.reduce((m,n) => Math.min(m, n.sort_order ?? 0), 0);
  const folderId = (activeFolder !== FOLDER_ALL && activeFolder !== FOLDER_UNFILED) ? activeFolder : null;
  const localNote = {
    id, user_id: uid, title: '', content: '', theme: [], pinned: false, folder_id: folderId,
    sort_order: minOrder - 1, updated_at: new Date().toISOString(),
    __pendingCreate: true
  };
  notes.unshift(localNote);
  renderGrid();
  openNote(id);
  document.getElementById('e-title').focus();

  try {
    const { data, error } = await sb.from('notes').insert({
      id, user_id: uid, title: '', content: '', theme: [], pinned: false, folder_id: folderId,
      sort_order: localNote.sort_order, updated_at: localNote.updated_at
    }).select().single();
    if (error) throw error;
    const i = notes.findIndex(n => n.id === id);
    if (i >= 0) { delete notes[i].__pendingCreate; Object.assign(notes[i], data); }
    if (currentId === id) editBaseUpdatedAt = data.updated_at;
    clearPendingDraft(id); // the row now exists — any draft written in the meantime becomes a normal 'update' on the next edit
  } catch(e) {
    // Offline — queue this as a pending creation; flushPendingEdits() inserts it once back online.
    savePendingDraft(id, { type: 'create', title: '', content: '', theme: [], baseUpdatedAt: null, sort_order: localNote.sort_order, pinned: false, folder_id: folderId });
    renderGrid();
  }
}

function askDelete() { document.getElementById('dialog-bg').className = 'show'; }
function closeDialog() { document.getElementById('dialog-bg').className = ''; }

async function doDelete() {
  closeDialog();
  if (!currentId) return;
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  try {
    await sb.from('trash').insert({ user_id: uid, title: note.title || '', content: note.content || '', deleted_at: new Date().toISOString() });
    await sb.from('notes').delete().eq('id', currentId);
    notes = notes.filter(n => n.id !== currentId);
    currentId = null;
    closeEditor();
    renderThemes();
    renderGrid();
  } catch(e) { console.error('Delete error:', e); setStatus('削除エラー', 'err'); }
}

async function restoreNote() {
  if (!currentId) return;
  const note = trashList.find(n => n.id === currentId);
  if (!note) return;
  try {
    const minOrder = notes.reduce((m,n) => Math.min(m, n.sort_order ?? 0), 0);
    await sb.from('notes').insert({ user_id: uid, title: note.title, content: note.content, theme: [], sort_order: minOrder - 1, updated_at: new Date().toISOString() });
    await sb.from('trash').delete().eq('id', currentId);
    trashList = trashList.filter(n => n.id !== currentId);
    currentId = null;
    closeEditor();
    await refreshQuietly();
  } catch(e) { console.error(e); }
}

async function toggleTrash() {
  inTrash   = !inTrash;
  currentId = null;
  query     = '';
  activeTheme = null;
  activeFolder = FOLDER_ALL;
  document.getElementById('search-input').value    = '';
  document.getElementById('mob-search-input').value = '';
  document.getElementById('s-label').textContent   = inTrash ? 'ゴミ箱' : 'Tomoya Memo';
  syncMobTitle();
  document.getElementById('new-btn').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('mob-new-btn').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('trash-btn').className   = inTrash ? 'hbtn on' : 'hbtn';
  document.getElementById('mob-trash-btn').className = inTrash ? 'hbtn on' : 'hbtn';
  document.getElementById('sort-row').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('mob-search').style.display = inTrash ? 'none' : '';
  document.getElementById('mob-folder-row').style.display = inTrash ? 'none' : '';
  document.getElementById('mob-tags-row').style.display = inTrash ? 'none' : '';
  closeEditor();
  renderFolders();
  renderThemes();
  renderGrid();
  if (inTrash) {
    const { data, error } = await sb.from('trash').select('id,title,content,deleted_at,original_id').order('deleted_at', { ascending: false });
    if (!error) { trashList = data || []; if (inTrash) renderGrid(); }
  }
}

function onSearch(v) {
  query = v;
  const d = document.getElementById('search-input'), m = document.getElementById('mob-search-input');
  if (d && d.value !== v) d.value = v;
  if (m && m.value !== v) m.value = v;
  renderGrid();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rel(iso) {
  if (!iso) return '';
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000)    return 'たった今';
  if (diff < 3600000)  return Math.floor(diff / 60000) + '分前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '時間前';
  return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
}
function setStatus(msg, cls) {
  const el = document.getElementById('e-status');
  el.textContent = msg;
  el.className   = cls || '';
}

document.getElementById('dialog-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('dialog-bg')) closeDialog();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });

/* Close the editor on a genuine backdrop click, but not when a text
   selection dragged from inside the editor happens to release on the
   backdrop — that's a text-select gesture, not a request to close. */
{
  const editorEl = document.getElementById('editor');
  let downOnBackdrop = false;
  editorEl.addEventListener('mousedown', e => { downOnBackdrop = (e.target === editorEl); });
  editorEl.addEventListener('click', e => {
    if (e.target === editorEl && downOnBackdrop) closeEditor();
    downOnBackdrop = false;
  });
}

/* iOS-style edge swipe: starting a touch within a thin strip at the very
   left of the screen and dragging right closes the editor, mirroring the
   system back-swipe gesture users already know. */
{
  const editorCard = document.getElementById('editor-card');
  const EDGE_ZONE = 24, MIN_DISTANCE = 80, MAX_VERTICAL_DRIFT = 60;
  let startX = null, startY = null, fromEdge = false;
  editorCard.addEventListener('touchstart', e => {
    if (!isMobileLayout() || e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    fromEdge = t.clientX <= EDGE_ZONE;
  }, { passive: true });
  editorCard.addEventListener('touchend', e => {
    if (!fromEdge || startX === null) { startX = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if (dx > MIN_DISTANCE && dy < MAX_VERTICAL_DRIFT) closeEditor();
    startX = null; fromEdge = false;
  }, { passive: true });
}
</script>
