<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #faf9f7;
    --border: #e2e0d8;
    --border-soft: #ece9e2;
    --text: #1a1916;
    --text-2: #6b6860;
    --text-3: #a9a79f;
    --accent: #2a2825;
    --accent-soft: #e8e6df;
    --green: #2d6a4f;
    --green-bg: #eaf4ee;
    --red: #9b2c2c;
    --red-bg: #fdf0f0;
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 8px;
    --sidebar-w: 260px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --surface: #1c1b18;
      --border: #2e2c28;
      --border-soft: #252320;
      --text: #f0ede6;
      --text-2: #8a877e;
      --text-3: #4a4844;
      --accent: #e8e4db;
      --accent-soft: #252320;
      --green: #4ade80;
      --green-bg: #0d2e1a;
      --red: #f87171;
      --red-bg: #2a0f0f;
    }
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; }

  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-top {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  #sidebar-top h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    font-family: var(--font-mono);
  }

  #new-btn {
    width: 28px; height: 28px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
    font-size: 18px;
    line-height: 1;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  #new-btn:hover { background: var(--accent-soft); border-color: var(--border); color: var(--text); }

  #search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
  #search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 11px;
    font-size: 13px;
    font-family: var(--font-sans);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #search::placeholder { color: var(--text-3); }
  #search:focus { border-color: var(--text-2); }

  #conn-status {
    margin: 8px 14px 4px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-3);
    padding: 3px 8px;
    border-radius: 100px;
    border: 1px solid var(--border-soft);
    width: fit-content;
  }
  #conn-status.ok { color: var(--green); border-color: var(--green-bg); background: var(--green-bg); }
  #conn-status.err { color: var(--red); border-color: var(--red-bg); background: var(--red-bg); }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  #notes-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  #notes-list::-webkit-scrollbar { width: 4px; }
  #notes-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .note-item {
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-soft);
    transition: background 0.1s;
    position: relative;
  }
  .note-item:hover { background: var(--accent-soft); }
  .note-item.active {
    background: var(--bg);
  }
  .note-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--text);
    border-radius: 0 1px 1px 0;
  }
  .ni-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .ni-preview {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
  .ni-date {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .empty-list {
    padding: 24px 16px;
    font-size: 13px;
    color: var(--text-3);
    text-align: center;
    font-family: var(--font-mono);
  }

  /* ── Main editor ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  #empty-state svg { opacity: 0.3; }

  #editor { display: none; flex: 1; flex-direction: column; overflow: hidden; }

  #editor-bar {
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #title-input {
    flex: 1;
    background: none;
    border: none;
    font-size: 16px;
    font-weight: 500;
    font-family: var(--font-sans);
    color: var(--text);
    outline: none;
    min-width: 0;
  }
  #title-input::placeholder { color: var(--text-3); font-weight: 300; }

  #save-status {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-3);
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 60px;
    text-align: right;
  }
  #save-status.saved { color: var(--green); }
  #save-status.error { color: var(--red); }

  #del-btn {
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    color: var(--text-3);
    padding: 5px 9px;
    border-radius: var(--radius);
    font-size: 12px;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #del-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }

  #content-input {
    flex: 1;
    padding: 20px 24px;
    background: none;
    border: none;
    resize: none;
    font-size: 14.5px;
    line-height: 1.85;
    font-family: var(--font-sans);
    font-weight: 300;
    color: var(--text);
    outline: none;
    overflow-y: auto;
  }
  #content-input::-webkit-scrollbar { width: 4px; }
  #content-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  #content-input::placeholder { color: var(--text-3); }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    :root { --sidebar-w: 100vw; }
    #app { flex-direction: column; }
    #sidebar { width: 100%; min-width: 100%; height: 100%; border-right: none; border-bottom: 1px solid var(--border); display: none; }
    #sidebar.mob-visible { display: flex; }
    #main { flex: 1; }
    #mob-back { display: flex !important; }
  }

  #mob-back {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-2);
    font-size: 13px;
    font-family: var(--font-sans);
    padding: 5px 0;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar" class="mob-visible">
    <div id="sidebar-top">
      <h1>Memo</h1>
      <button id="new-btn" onclick="newNote()" title="新しいメモ">+</button>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="検索…" oninput="filterNotes(this.value)" />
    </div>
    <div id="conn-status"><span class="dot"></span><span id="conn-text">接続確認中…</span></div>
    <div id="notes-list"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span>メモを選択するか、新しいメモを作成</span>
    </div>

    <div id="editor">
      <div id="editor-bar">
        <button id="mob-back" onclick="showSidebar()">← 一覧</button>
        <input id="title-input" type="text" placeholder="タイトル…" oninput="scheduleSave()" />
        <span id="save-status"></span>
        <button id="del-btn" onclick="deleteNote()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          削除
        </button>
      </div>
      <textarea id="content-input" placeholder="ここにメモを書いてください…" oninput="scheduleSave()"></textarea>
    </div>
  </div>
</div>

<script>
// ── 設定 ──────────────────────────────────────────
const SUPABASE_URL = 'https://nxikzklntxagosklypbq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54aWt6a2xudHhhZ29za2x5cGJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Nzk2NzksImV4cCI6MjA5NjQ1NTY3OX0.7n0UCkqM1CFaN14m7qu9ig4kcO9kPQBuIe302toQ5R0';
// ──────────────────────────────────────────────────

const H = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let notes = [];
let currentId = null;
let saveTimer = null;
let searchQuery = '';
let ws = null;

async function req(method, path, body) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method,
    headers: H,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

// ── 初期ロード ──
async function loadNotes() {
  try {
    const data = await req('GET', 'notes?order=updated_at.desc&select=id,title,content,updated_at');
    notes = data || [];
    renderList();
    setConn(true);
    startRealtime();
  } catch(e) {
    setConn(false);
    console.error(e);
  }
}

function setConn(ok) {
  const el = document.getElementById('conn-status');
  const txt = document.getElementById('conn-text');
  el.className = ok ? 'ok' : 'err';
  txt.textContent = ok ? '接続済み' : '接続エラー';
}

// ── リアルタイム同期 ──
function startRealtime() {
  const url = SUPABASE_URL.replace('https', 'wss') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
  ws = new WebSocket(url);
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: 'realtime:public:notes', event: 'phx_join', payload: {}, ref: '1' }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (['INSERT','UPDATE','DELETE'].includes(msg.event)) {
      loadNotes();
    }
  };
  ws.onclose = () => setTimeout(startRealtime, 3000);
}

// ── リスト描画 ──
function renderList() {
  const el = document.getElementById('notes-list');
  const q = searchQuery.toLowerCase();
  const filtered = notes.filter(n =>
    !q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q)
  );
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-list">メモなし</div>';
    return;
  }
  el.innerHTML = filtered.map(n => `
    <div class="note-item${n.id === currentId ? ' active' : ''}" onclick="selectNote('${n.id}')">
      <div class="ni-title">${esc(n.title || '無題のメモ')}</div>
      <div class="ni-preview">${esc((n.content || '').slice(0, 70))}</div>
      <div class="ni-date">${relTime(n.updated_at)}</div>
    </div>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), diff = now - d;
  if (diff < 60000) return 'たった今';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '時間前';
  return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
}

// ── メモ選択 ──
function selectNote(id) {
  currentId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return;
  document.getElementById('empty-state').style.display = 'none';
  const ed = document.getElementById('editor');
  ed.style.display = 'flex';
  document.getElementById('title-input').value = note.title || '';
  document.getElementById('content-input').value = note.content || '';
  setStatus('');
  renderList();
  // モバイル：サイドバーを隠してエディタ表示
  if (window.innerWidth <= 600) {
    document.getElementById('sidebar').classList.remove('mob-visible');
  }
}

function showSidebar() {
  document.getElementById('sidebar').classList.add('mob-visible');
  currentId = null;
  document.getElementById('editor').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  renderList();
}

// ── 新規作成 ──
async function newNote() {
  try {
    const data = await req('POST', 'notes', { title: '', content: '', updated_at: new Date().toISOString() });
    const note = Array.isArray(data) ? data[0] : data;
    notes.unshift(note);
    renderList();
    selectNote(note.id);
    document.getElementById('title-input').focus();
  } catch(e) { setStatus('エラー', true); }
}

// ── 自動保存 ──
function scheduleSave() {
  setStatus('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNote, 800);
}

async function saveNote() {
  if (!currentId) return;
  const title = document.getElementById('title-input').value;
  const content = document.getElementById('content-input').value;
  try {
    setStatus('保存中');
    await req('PATCH', `notes?id=eq.${currentId}`, { title, content, updated_at: new Date().toISOString() });
    const i = notes.findIndex(n => n.id === currentId);
    if (i >= 0) { notes[i].title = title; notes[i].content = content; notes[i].updated_at = new Date().toISOString(); }
    notes.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderList();
    setStatus('保存済み ✓', false, true);
    setTimeout(() => setStatus(''), 2500);
  } catch(e) { setStatus('保存エラー', true); }
}

// ── 削除 ──
async function deleteNote() {
  if (!currentId) return;
  if (!confirm('このメモを削除しますか？')) return;
  try {
    await req('DELETE', `notes?id=eq.${currentId}`);
    notes = notes.filter(n => n.id !== currentId);
    currentId = null;
    document.getElementById('editor').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    renderList();
  } catch(e) { setStatus('削除エラー', true); }
}

// ── 検索 ──
function filterNotes(q) {
  searchQuery = q;
  renderList();
}

// ── ステータス表示 ──
function setStatus(msg, isErr, isOk) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = isErr ? 'error' : isOk ? 'saved' : '';
}

loadNotes();
</script>
</body>
</html>
