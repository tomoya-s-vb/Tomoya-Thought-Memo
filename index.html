<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #faf9f7; --border: #e2e0d8;
  --text: #1a1916; --text2: #6b6860; --text3: #a9a79f; --soft: #e8e6df;
  --green: #2d6a4f; --greenbg: #eaf4ee; --red: #9b2c2c; --redbg: #fdf0f0;
  --amber: #a9720b; --amberbg: #f8f0dd;
  --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --surface: #1c1b18; --border: #2e2c28;
    --text: #f0ede6; --text2: #8a877e; --text3: #4a4844; --soft: #252320;
    --green: #4ade80; --greenbg: #0d2e1a; --red: #f87171; --redbg: #2a0f0f;
    --amber: #f2c14e; --amberbg: #2b230e;
  }
}
html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); }
#app { display: none; height: 100vh; overflow: hidden; }
#app.show { display: flex; }

/* Login screen */
#login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
#login-screen.hide { display: none; }
#login-box { width: 100%; max-width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 26px; }
#login-box h1 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
#login-box p { font-size: 12px; color: var(--text3); margin-bottom: 20px; font-family: var(--mono); }
#login-box input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; outline: none; margin-bottom: 10px; }
#login-box input:focus { border-color: var(--text2); }
#login-box button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: var(--text); color: var(--bg); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
#login-box button:hover { opacity: .9; }
#login-err { font-size: 12px; color: var(--red); margin-top: 10px; font-family: var(--mono); min-height: 16px; }

/* Sidebar (rail: search / theme filter / trash-new) */
#sidebar { width: 250px; min-width: 250px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#s-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#s-head span { font-family: var(--mono); font-size: 12px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; }
#s-head-btns { display: flex; gap: 6px; }
.hbtn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink:0; }
.hbtn:hover { background: var(--soft); color: var(--text); }
.hbtn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
#s-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
#s-search input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; }
#s-search input:focus { border-color: var(--text2); }
#s-search input::placeholder { color: var(--text3); }

#sort-row { padding: 0 12px 10px; display:flex; gap:6px; }
.sortbtn { flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text2); font-family:var(--mono); font-size:11px; cursor:pointer; transition:.15s; }
.sortbtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

#s-conn { margin: 0 12px 10px; font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 100px; border: 1px solid var(--border); color: var(--text3); display: inline-flex; align-items: center; gap: 5px; width: fit-content; }
#s-conn.ok { color: var(--green); background: var(--greenbg); border-color: var(--greenbg); }
#s-conn.err { color: var(--red); background: var(--redbg); border-color: var(--redbg); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

#theme-label-row { padding: 4px 10px 4px 14px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
#theme-label { font-family:var(--mono); font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; }
#tag-sort-btns { display:flex; gap:4px; }
.tinybtn { padding:2px 7px; border:1px solid var(--border); border-radius:5px; background:var(--bg); color:var(--text3); font-family:var(--mono); font-size:10px; cursor:pointer; }
.tinybtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
#sidebar-close-btn { display: none; }
#theme-list { padding: 0 10px 12px; display:flex; flex-wrap:wrap; gap:5px; overflow-y:auto; }
.theme-chip { font-size: 11px; font-family: var(--mono); padding: 4px 10px; border-radius: 100px; border:1px solid var(--border); background: var(--bg); color: var(--text2); cursor:pointer; white-space:nowrap; transition:.15s; }
.theme-chip:hover { background: var(--soft); }
.theme-chip.active { background: var(--amberbg); color: var(--amber); border-color: var(--amberbg); }
.theme-chip.dragging { opacity: .35; }
.theme-chip.drop-target { border-color: var(--green); }
#s-foot { margin-top:auto; padding: 10px 12px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px; }
#s-foot span { font-size:10px; font-family:var(--mono); color:var(--text3); }
#logout-btn { font-size:10px; font-family:var(--mono); color:var(--text3); background:none; border:none; cursor:pointer; text-decoration:underline; flex-shrink:0; }
#logout-btn:hover { color: var(--text); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position:relative; }

/* Grid of cards */
#grid-wrap { flex:1; overflow-y:auto; }
#grid { padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 14px; align-content: start; }
.empty-msg { padding: 40px 20px; font-size: 13px; color: var(--text3); text-align: center; font-family: var(--mono); grid-column: 1/-1; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 13px 15px; height: 168px; display: flex; flex-direction: column;
  cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .1s; position: relative;
}
.card:hover { box-shadow: 0 3px 14px rgba(0,0,0,.07); border-color: var(--text3); }
.card.trashed { opacity: .6; }
.card.dragging { opacity: .35; transform: scale(.97); }
.card.drop-target { border-color: var(--green); }
.card-drag-handle { position:absolute; top:8px; right:9px; font-size:11px; color:var(--text3); cursor:grab; opacity:0; transition:.15s; }
.card:hover .card-drag-handle { opacity: 1; }
.card-title { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right:16px; margin-bottom: 6px; }
.card-body { flex: 1; font-size: 12px; color: var(--text2); line-height: 1.65; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; }
.card-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 8px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; overflow: hidden; max-height: 19px; }
.tag-chip { font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 100px; background: var(--soft); color: var(--text2); white-space: nowrap; }
.card-date { font-size: 10px; font-family: var(--mono); color: var(--text3); white-space: nowrap; flex-shrink:0; }

.new-card { border: 1px dashed var(--border); background: none; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 26px; font-weight: 300; }
.new-card:hover { border-color: var(--text2); color: var(--text2); background: var(--soft); }

/* Editor: centered modal on desktop */
#editor { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
#editor.open { display: flex; }
#editor-card { background: var(--bg); border-radius: 12px; width: 100%; max-width: 640px; height: 80vh; max-height: 700px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
#e-bar { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
#e-back { display:flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:var(--text2); font-size:13px; font-family:var(--sans); padding:4px 2px; flex-shrink:0; }
#e-back:hover { color: var(--text); }
#e-title { flex: 1; min-width:140px; background: none; border: none; font-size: 16px; font-weight: 500; font-family: var(--sans); color: var(--text); outline: none; }
#e-title::placeholder { color: var(--text3); font-weight: 300; }
#e-theme { width: 170px; background: none; border: 1px solid var(--border); border-radius:6px; padding:5px 9px; font-size: 12px; font-family: var(--mono); color: var(--text2); outline:none; }
#e-theme:focus { border-color: var(--text2); }
#e-theme::placeholder { color: var(--text3); }
#e-status { font-size: 11px; font-family: var(--mono); color: var(--text3); white-space: nowrap; }
#e-status.ok { color: var(--green); }
#e-status.err { color: var(--red); }
.ebtn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text2); font-size: 12px; font-family: var(--mono); cursor: pointer; transition: .15s; }
.ebtn:hover { background: var(--soft); color: var(--text); }
.ebtn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.ebtn.del:hover { background: var(--redbg); color: var(--red); border-color: var(--redbg); }
.ebtn.res:hover { background: var(--greenbg); color: var(--green); border-color: var(--greenbg); }

#e-body { flex: 1; display: flex; overflow: hidden; }
#e-input {
  flex: 1; padding: 20px 24px; border: none; background: none; resize: none;
  font-size: 14px; line-height: 1.85; font-family: var(--mono); font-weight: 300;
  color: var(--text); outline: none; overflow-y: auto;
}
#e-input::placeholder { color: var(--text3); }
#e-preview {
  flex: 1; padding: 20px 24px; overflow-y: auto; font-size: 14px; line-height: 1.85;
  font-weight: 300; border-left: 1px solid var(--border); display: none;
}
#e-preview h1 { font-size: 1.6em; font-weight: 500; margin: .4em 0 .3em; padding-bottom: .2em; border-bottom: 1px solid var(--border); line-height: 1.3; }
#e-preview h2 { font-size: 1.3em; font-weight: 500; margin: .6em 0 .2em; line-height: 1.3; }
#e-preview h3 { font-size: 1.1em; font-weight: 500; margin: .5em 0 .2em; }
#e-preview p { margin: .35em 0; }
#e-preview ul, #e-preview ol { padding-left: 1.4em; margin: .3em 0; }
#e-preview li { margin: .1em 0; }
#e-preview strong { font-weight: 500; }
#e-preview em { font-style: italic; }
#e-preview code { font-family: var(--mono); font-size: .87em; background: var(--soft); padding: .1em .35em; border-radius: 4px; }
#e-preview pre { background: var(--soft); padding: .8em 1em; border-radius: 6px; margin: .4em 0; overflow-x: auto; }
#e-preview pre code { background: none; padding: 0; }
#e-preview blockquote { border-left: 3px solid var(--border); padding-left: .8em; color: var(--text2); margin: .4em 0; }
#e-preview a { color: var(--green); }
#e-preview hr { border: none; border-top: 1px solid var(--border); margin: .6em 0; }
#e-preview table { border-collapse: collapse; width: 100%; font-size: 13px; margin: .4em 0; }
#e-preview th, #e-preview td { border: 1px solid var(--border); padding: 5px 9px; }
#e-preview th { background: var(--soft); font-weight: 500; }

/* Dialog */
#dialog-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99; align-items: center; justify-content: center; }
#dialog-bg.show { display: flex; }
#dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 26px; width: 320px; }
#dialog h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
#dialog p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 18px; }
.d-btns { display: flex; gap: 8px; justify-content: flex-end; }
.d-btns button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: none; font-family: var(--sans); font-size: 13px; color: var(--text); cursor: pointer; }
.d-btns button.confirm { background: var(--red); color: #fff; border-color: var(--red); }

/* List view (alternative to card grid) */
#grid.list-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 18px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s;
}
.row:hover { background: var(--soft); }
.row.trashed { opacity: .6; }
.row.dragging { opacity: .35; }
.row.drop-target { border-top: 2px solid var(--green); }
.row-drag-handle { font-size: 12px; color: var(--text3); cursor: grab; flex-shrink: 0; }
.row-title { font-size: 13.5px; font-weight: 500; flex-shrink: 0; width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-body { flex: 1; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-tags { display: flex; gap: 4px; flex-shrink: 0; }
.row-date { font-size: 10px; font-family: var(--mono); color: var(--text3); flex-shrink: 0; width: 60px; text-align: right; }
.new-row { display: flex; align-items: center; gap: 8px; padding: 11px 18px; color: var(--text3); cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; }
.new-row:hover { background: var(--soft); color: var(--text2); }

/* Mobile top bar (hidden on desktop) */
#mob-topbar { display: none; }

/* Mobile */
@media (max-width: 640px) {
  #sidebar { position: fixed; inset: 0; z-index: 10; width: 100% !important; transform: translateX(-100%); transition: transform .25s; }
  #sidebar.open { transform: translateX(0); }
  #sidebar-close-btn { display: flex; }
  #mob-topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #mob-title { font-size: 14px; font-weight: 500; }
  #e-preview { display: none !important; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
  .card { height: 140px; }
  .row-title { width: 110px; }

  /* Editor: full-screen instead of centered modal */
  #editor { background: none; padding: 0; align-items: stretch; }
  #editor-card { max-width: none; width: 100%; height: 100%; max-height: none; border-radius: 0; }

  /* Prevent iOS Safari auto-zoom on focus (needs >=16px font-size on inputs) */
  #search-input, #e-title, #e-theme, #e-input, #login-email, #login-pass { font-size: 16px; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Memo</h1>
    <p>ログインしてください</p>
    <input id="login-email" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="login-pass" type="password" placeholder="パスワード" autocomplete="current-password">
    <button onclick="doLogin()">ログイン</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <div id="s-head">
      <span id="s-label">Memo</span>
      <div id="s-head-btns">
        <button class="hbtn" id="view-btn" title="表示切替" onclick="toggleView()">▦</button>
        <button class="hbtn" id="trash-btn" title="ゴミ箱" onclick="toggleTrash()">🗑</button>
        <button class="hbtn" id="new-btn" title="新規" onclick="newNote()">＋</button>
        <button class="hbtn" id="sidebar-close-btn" title="閉じる" onclick="closeSidebarMobile()">✕</button>
      </div>
    </div>
    <div id="s-search"><input id="search-input" placeholder="検索…" oninput="onSearch(this.value)"></div>
    <div id="sort-row">
      <button class="sortbtn" id="sort-manual" onclick="setSortMode('manual')">↕ 手動</button>
      <button class="sortbtn" id="sort-auto" onclick="setSortMode('auto')">🕒 更新順</button>
    </div>
    <div id="s-conn"><span class="dot"></span><span id="conn-label">接続確認中…</span></div>
    <div id="theme-label-row">
      <span id="theme-label">タグで絞り込み</span>
      <div id="tag-sort-btns">
        <button class="tinybtn" id="tag-sort-alpha" onclick="setTagSortMode('alpha')" title="abc順">abc</button>
        <button class="tinybtn" id="tag-sort-manual" onclick="setTagSortMode('manual')" title="手動並び替え">↕</button>
      </div>
    </div>
    <div id="theme-list"></div>
    <div id="s-foot"><span>ホーム画面に追加で一発起動</span><button id="logout-btn" onclick="doLogout()">ログアウト</button></div>
  </div>

  <div id="main">
    <div id="mob-topbar">
      <button class="hbtn" onclick="openSidebarMobile()">☰</button>
      <span id="mob-title">Memo</span>
    </div>
    <div id="grid-wrap"><div id="grid"></div></div>

    <div id="editor" onclick="if(event.target.id==='editor') closeEditor()">
      <div id="editor-card">
        <div id="e-bar">
          <button id="e-back" onclick="closeEditor()">← 一覧</button>
          <input id="e-title" placeholder="タイトル…" oninput="onEdit()">
          <input id="e-theme" placeholder="タグ (カンマ区切り)" oninput="onEdit()">
          <span id="e-status"></span>
          <button class="ebtn" id="btn-preview" onclick="togglePreview()">プレビュー</button>
          <button class="ebtn del" id="btn-del" onclick="askDelete()">削除</button>
          <button class="ebtn res" id="btn-res" onclick="restoreNote()" style="display:none">復元</button>
        </div>
        <div id="e-body">
          <textarea id="e-input"
            placeholder="ここにメモを書いてください…&#10;&#10;マークダウン記法も使えます：&#10;# 見出し1  ## 見出し2&#10;**太字**  *斜体*  `コード`&#10;- リスト項目"
            oninput="onEdit(); updatePreview()"></textarea>
          <div id="e-preview"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="dialog-bg">
  <div id="dialog">
    <h3>ゴミ箱に移動しますか？</h3>
    <p>30日後に自動的に完全削除されます。ゴミ箱から復元することもできます。</p>
    <div class="d-btns">
      <button onclick="closeDialog()">キャンセル</button>
      <button class="confirm" onclick="doDelete()">ゴミ箱へ移動</button>
    </div>
  </div>
</div>

<script>
/* ▼▼ ここを新しいプロジェクトのURL / anon keyに差し替えてください ▼▼ */
const SUPABASE_URL = 'https://itvumfppblhirvbuynwt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iOkh_MHaXukHHDHV8d8Shw__rwczL54';
/* ▲▲ ここまで ▲▲ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let notes = [], trashList = [], currentId = null, inTrash = false, saveTimer = null;
let query = '', showPreview = false, sortMode = 'manual', activeTheme = null, dragId = null, dragMoved = false;
let uid = null, viewMode = 'grid';

/* ── Auth ──
   Realtime with RLS needs the session's access token explicitly handed to the
   realtime client (sb.realtime.setAuth). Without this, postgres_changes events
   are silently dropped for RLS-protected tables — this was missing before and
   is why changes weren't syncing across devices. */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { err.textContent = 'ログインできませんでした: ' + error.message; return; }
  uid = data.user.id;
  await sb.realtime.setAuth(data.session.access_token);
  enterApp();
}
async function doLogout() {
  await sb.auth.signOut();
  uid = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hide');
}
function enterApp() {
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app').classList.add('show');
  boot();
}
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* Keep the realtime connection authenticated across token refreshes */
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    uid = session.user.id;
    sb.realtime.setAuth(session.access_token);
  }
});

(async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    uid = session.user.id;
    await sb.realtime.setAuth(session.access_token);
    enterApp();
  }
})();

/* ── Boot ── */
async function boot() {
  try {
    const { data, error } = await sb.from('notes').select('id,title,content,theme,sort_order,updated_at').order('updated_at', { ascending: false });
    if (error) throw error;
    notes = data || [];
    setConn(true);
    renderThemes();
    renderGrid();
    wireRealtime();
    if (new URLSearchParams(location.search).get('new') === '1' && !window.__autoNewDone) {
      window.__autoNewDone = true; newNote();
    }
  } catch(e) { setConn(false); console.error(e); }
}

function setConn(ok) {
  const el = document.getElementById('s-conn');
  el.className = ok ? 'ok' : 'err';
  document.getElementById('conn-label').textContent = ok ? '接続済み' : '接続エラー';
}

let realtimeWired = false;
function wireRealtime() {
  if (realtimeWired) return;
  realtimeWired = true;
  sb.channel('notes-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, () => refreshQuietly())
    .subscribe();
}

async function refreshQuietly() {
  try {
    const { data, error } = await sb.from('notes').select('id,title,content,theme,sort_order,updated_at').order('updated_at', { ascending: false });
    if (error) throw error;
    notes = data || [];
    setConn(true);
    renderThemes();
    if (!inTrash) renderGrid();
  } catch(e) { setConn(false); }
}

/* ── Sort mode ── */
function setSortMode(mode) {
  sortMode = mode;
  document.getElementById('sort-manual').className = mode === 'manual' ? 'sortbtn active' : 'sortbtn';
  document.getElementById('sort-auto').className    = mode === 'auto'   ? 'sortbtn active' : 'sortbtn';
  renderGrid();
}
setSortMode('manual');

/* ── Tag filter (uses the "theme" data field) ── */
let tagSortMode = localStorage.getItem('tagSortMode') || 'alpha';
let tagOrder = JSON.parse(localStorage.getItem('tagOrder') || '[]');
let tagDragId = null;

function setTagSortMode(mode) {
  tagSortMode = mode;
  localStorage.setItem('tagSortMode', mode);
  document.getElementById('tag-sort-alpha').className  = mode === 'alpha'  ? 'tinybtn active' : 'tinybtn';
  document.getElementById('tag-sort-manual').className = mode === 'manual' ? 'tinybtn active' : 'tinybtn';
  renderThemes();
}

function renderThemes() {
  const all = new Set();
  notes.forEach(n => (n.theme || []).forEach(t => all.add(t)));
  const el = document.getElementById('theme-list');
  el.innerHTML = '';
  if (!all.size) { el.innerHTML = '<span style="font-size:11px;color:var(--text3);padding:2px 4px;">まだタグがありません</span>'; return; }

  let ordered;
  if (tagSortMode === 'alpha') {
    ordered = [...all].sort();
  } else {
    // manual: stored order first, then any new tags not yet placed
    ordered = tagOrder.filter(t => all.has(t)).concat([...all].filter(t => !tagOrder.includes(t)));
    tagOrder = ordered;
    localStorage.setItem('tagOrder', JSON.stringify(tagOrder));
  }

  ordered.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'theme-chip' + (activeTheme === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = () => {
      activeTheme = activeTheme === t ? null : t;
      renderThemes();
      renderGrid();
      closeSidebarMobile();
    };
    if (tagSortMode === 'manual') {
      chip.draggable = true;
      chip.addEventListener('dragstart', () => { tagDragId = t; chip.classList.add('dragging'); });
      chip.addEventListener('dragend',   () => { chip.classList.remove('dragging'); document.querySelectorAll('.theme-chip.drop-target').forEach(c=>c.classList.remove('drop-target')); });
      chip.addEventListener('dragover',  e => { e.preventDefault(); chip.classList.add('drop-target'); });
      chip.addEventListener('dragleave', () => { chip.classList.remove('drop-target'); });
      chip.addEventListener('drop', e => {
        e.preventDefault(); chip.classList.remove('drop-target');
        if (tagDragId && tagDragId !== t) {
          const from = tagOrder.indexOf(tagDragId), to = tagOrder.indexOf(t);
          if (from >= 0 && to >= 0) {
            tagOrder.splice(to, 0, tagOrder.splice(from, 1)[0]);
            localStorage.setItem('tagOrder', JSON.stringify(tagOrder));
            renderThemes();
          }
        }
        tagDragId = null;
      });
    }
    el.appendChild(chip);
  });
}
setTagSortMode(tagSortMode);

/* ── View mode (card grid / list) ── */
function toggleView() {
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  document.getElementById('view-btn').textContent = viewMode === 'grid' ? '▦' : '☰';
  document.getElementById('view-btn').title = viewMode === 'grid' ? 'リスト表示に切替' : 'カード表示に切替';
  renderGrid();
}

/* ── Grid ── */
function getSorted() {
  let list = inTrash ? trashList : notes.slice();
  const q = query.toLowerCase();
  list = list.filter(n =>
    (!q || (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q)) &&
    (!activeTheme || inTrash || (n.theme||[]).includes(activeTheme))
  );
  if (!inTrash) {
    if (sortMode === 'manual') list.sort((a,b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
    else list.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  } else {
    list.sort((a,b) => new Date(b.deleted_at) - new Date(a.deleted_at));
  }
  return list;
}

function renderGrid() {
  const el = document.getElementById('grid');
  el.classList.toggle('list-mode', viewMode === 'list');
  if (viewMode === 'list') renderRows(el); else renderCards(el);
}

function wireDrag(item, n) {
  if (inTrash || sortMode !== 'manual') return;
  item.draggable = true;
  item.addEventListener('dragstart', () => { dragId = n.id; item.classList.add('dragging'); });
  item.addEventListener('dragend',   () => { item.classList.remove('dragging'); document.querySelectorAll('.drop-target').forEach(c=>c.classList.remove('drop-target')); });
  item.addEventListener('dragover',  e => { e.preventDefault(); item.classList.add('drop-target'); });
  item.addEventListener('dragleave', () => { item.classList.remove('drop-target'); });
  item.addEventListener('drop', e => {
    e.preventDefault(); item.classList.remove('drop-target');
    if (dragId && dragId !== n.id) reorder(dragId, n.id);
    dragId = null;
  });
}

function renderCards(el) {
  const show = getSorted();
  el.innerHTML = '';

  if (!inTrash) {
    const nc = document.createElement('div');
    nc.className = 'card new-card';
    nc.textContent = '＋';
    nc.onclick = newNote;
    el.appendChild(nc);
  }

  if (!show.length && inTrash) { el.innerHTML += '<div class="empty-msg">ゴミ箱は空です</div>'; return; }
  if (!show.length && !inTrash) return;

  show.forEach(n => {
    const card = document.createElement('div');
    card.className = 'card' + (inTrash ? ' trashed' : '');
    card.dataset.id = n.id;
    const tagsHtml = (n.theme||[]).slice(0,3).map(t => '<span class="tag-chip">'+esc(t)+'</span>').join('');
    card.innerHTML =
      (!inTrash && sortMode==='manual' ? '<div class="card-drag-handle">⠿</div>' : '') +
      '<div class="card-title">' + esc(n.title || '無題のメモ') + '</div>' +
      '<div class="card-body">' + esc((n.content || '').replace(/[#*`>]/g,'')) + '</div>' +
      '<div class="card-footer"><div class="card-tags">' + tagsHtml + '</div>' +
      '<div class="card-date">' + (inTrash ? rel(n.deleted_at) : rel(n.updated_at)) + '</div></div>';
    card.addEventListener('click', () => { if (dragMoved) { dragMoved=false; return; } openNote(n.id); });
    wireDrag(card, n);
    el.appendChild(card);
  });
}

function renderRows(el) {
  const show = getSorted();
  el.innerHTML = '';

  if (!inTrash) {
    const nr = document.createElement('div');
    nr.className = 'new-row';
    nr.textContent = '＋ 新規メモ';
    nr.onclick = newNote;
    el.appendChild(nr);
  }

  if (!show.length && inTrash) { el.innerHTML += '<div class="empty-msg">ゴミ箱は空です</div>'; return; }
  if (!show.length && !inTrash) return;

  show.forEach(n => {
    const row = document.createElement('div');
    row.className = 'row' + (inTrash ? ' trashed' : '');
    row.dataset.id = n.id;
    const tagsHtml = (n.theme||[]).slice(0,2).map(t => '<span class="tag-chip">'+esc(t)+'</span>').join('');
    row.innerHTML =
      (!inTrash && sortMode==='manual' ? '<span class="row-drag-handle">⠿</span>' : '') +
      '<div class="row-title">' + esc(n.title || '無題のメモ') + '</div>' +
      '<div class="row-body">' + esc((n.content || '').replace(/[#*`>]/g,'')) + '</div>' +
      '<div class="row-tags">' + tagsHtml + '</div>' +
      '<div class="row-date">' + (inTrash ? rel(n.deleted_at) : rel(n.updated_at)) + '</div>';
    row.addEventListener('click', () => { if (dragMoved) { dragMoved=false; return; } openNote(n.id); });
    wireDrag(row, n);
    el.appendChild(row);
  });
}

async function reorder(draggedId, targetId) {
  dragMoved = true;
  const list = getSorted().filter(() => !inTrash);
  const from = list.findIndex(n => n.id === draggedId);
  const to   = list.findIndex(n => n.id === targetId);
  if (from < 0 || to < 0) return;
  list.splice(to, 0, list.splice(from, 1)[0]);
  list.forEach((n, i) => { n.sort_order = i; });
  renderGrid();
  try {
    await Promise.all(list.map(n => sb.from('notes').update({ sort_order: n.sort_order }).eq('id', n.id)));
    const map = new Map(list.map(n => [n.id, n.sort_order]));
    notes.forEach(n => { if (map.has(n.id)) n.sort_order = map.get(n.id); });
  } catch(e) { console.error('reorder save error', e); }
}

/* ── Mobile sidebar toggle ── */
function openSidebarMobile() { document.getElementById('sidebar').classList.add('open'); }
function closeSidebarMobile() { document.getElementById('sidebar').classList.remove('open'); }
function syncMobTitle() { document.getElementById('mob-title').textContent = document.getElementById('s-label').textContent; }

/* ── Open note / editor ── */
function openNote(id) {
  const list = inTrash ? trashList : notes;
  const note = list.find(n => n.id === id);
  if (!note) return;

  currentId = id;
  document.getElementById('editor').classList.add('open');
  document.getElementById('e-title').value = note.title || '';
  document.getElementById('e-theme').value = (note.theme || []).join(', ');
  document.getElementById('e-input').value = note.content || '';
  document.getElementById('e-title').disabled = inTrash;
  document.getElementById('e-theme').disabled = inTrash;
  document.getElementById('e-input').disabled = inTrash;
  document.getElementById('btn-del').style.display = inTrash ? 'none' : '';
  document.getElementById('btn-res').style.display = inTrash ? '' : 'none';
  document.getElementById('btn-preview').style.display = inTrash ? 'none' : '';

  updatePreview();
  setStatus('');
  closeSidebarMobile();
}
function closeEditor() {
  document.getElementById('editor').classList.remove('open');
  currentId = null;
}

function togglePreview() {
  showPreview = !showPreview;
  document.getElementById('btn-preview').className = showPreview ? 'ebtn active' : 'ebtn';
  document.getElementById('e-preview').style.display = showPreview ? 'block' : 'none';
  updatePreview();
}
function updatePreview() {
  if (!showPreview) return;
  document.getElementById('e-preview').innerHTML = marked.parse(document.getElementById('e-input').value || '');
}

function onEdit() {
  if (inTrash) return;
  setStatus('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 900);
}
function parseThemes(v) { return v.split(',').map(s => s.trim()).filter(Boolean); }

async function save() {
  if (!currentId || inTrash) return;
  const title   = document.getElementById('e-title').value;
  const content = document.getElementById('e-input').value;
  const theme   = parseThemes(document.getElementById('e-theme').value);
  try {
    const { error } = await sb.from('notes').update({ title, content, theme, updated_at: new Date().toISOString() }).eq('id', currentId);
    if (error) throw error;
    const i = notes.findIndex(n => n.id === currentId);
    if (i >= 0) Object.assign(notes[i], { title, content, theme, updated_at: new Date().toISOString() });
    renderThemes();
    setStatus('保存済み ✓', 'ok');
    setTimeout(() => setStatus(''), 2500);
  } catch(e) { setStatus('保存エラー', 'err'); }
}

async function newNote() {
  try {
    const minOrder = notes.reduce((m,n) => Math.min(m, n.sort_order ?? 0), 0);
    const { data, error } = await sb.from('notes').insert({ user_id: uid, title: '', content: '', theme: [], sort_order: minOrder - 1, updated_at: new Date().toISOString() }).select().single();
    if (error) throw error;
    notes.unshift(data);
    renderGrid();
    openNote(data.id);
    document.getElementById('e-title').focus();
  } catch(e) { console.error(e); }
}

function askDelete() { document.getElementById('dialog-bg').className = 'show'; }
function closeDialog() { document.getElementById('dialog-bg').className = ''; }

async function doDelete() {
  closeDialog();
  if (!currentId) return;
  const note = notes.find(n => n.id === currentId);
  if (!note) return;
  try {
    await sb.from('trash').insert({ user_id: uid, title: note.title || '', content: note.content || '', deleted_at: new Date().toISOString() });
    await sb.from('notes').delete().eq('id', currentId);
    notes = notes.filter(n => n.id !== currentId);
    currentId = null;
    closeEditor();
    renderThemes();
    renderGrid();
  } catch(e) { console.error('Delete error:', e); setStatus('削除エラー', 'err'); }
}

async function restoreNote() {
  if (!currentId) return;
  const note = trashList.find(n => n.id === currentId);
  if (!note) return;
  try {
    const minOrder = notes.reduce((m,n) => Math.min(m, n.sort_order ?? 0), 0);
    await sb.from('notes').insert({ user_id: uid, title: note.title, content: note.content, theme: [], sort_order: minOrder - 1, updated_at: new Date().toISOString() });
    await sb.from('trash').delete().eq('id', currentId);
    trashList = trashList.filter(n => n.id !== currentId);
    currentId = null;
    closeEditor();
    await refreshQuietly();
  } catch(e) { console.error(e); }
}

async function toggleTrash() {
  inTrash   = !inTrash;
  currentId = null;
  query     = '';
  activeTheme = null;
  document.getElementById('search-input').value    = '';
  document.getElementById('s-label').textContent   = inTrash ? 'ゴミ箱' : 'Memo';
  syncMobTitle();
  document.getElementById('new-btn').style.display = inTrash ? 'none' : 'flex';
  document.getElementById('trash-btn').className   = inTrash ? 'hbtn on' : 'hbtn';
  document.getElementById('sort-row').style.display = inTrash ? 'none' : 'flex';
  closeEditor();
  closeSidebarMobile();
  if (inTrash) {
    const { data, error } = await sb.from('trash').select('id,title,content,deleted_at,original_id').order('deleted_at', { ascending: false });
    if (!error) trashList = data || [];
  }
  renderThemes();
  renderGrid();
}

function onSearch(v) { query = v; renderGrid(); }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rel(iso) {
  if (!iso) return '';
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000)    return 'たった今';
  if (diff < 3600000)  return Math.floor(diff / 60000) + '分前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '時間前';
  return d.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
}
function setStatus(msg, cls) {
  const el = document.getElementById('e-status');
  el.textContent = msg;
  el.className   = cls || '';
}

document.getElementById('dialog-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('dialog-bg')) closeDialog();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
</script>
